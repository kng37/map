<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>전술 지도 메모장 (오토 크롭 미니맵 뷰어)</title>
    <style>
        :root {
            --bg: #12141a;
            --panel: #1a1d26;
            --panel-2: #222632;
            --border: #2e3444;
            --border-soft: #3a4155;
            --text: #e8eaef;
            --muted: #8b93a7;
            --accent: #5b8def;
            --accent-hover: #4a7de0;
            --green: #3d9b6e;
            --green-hover: #348a60;
            --orange: #d4893a;
            --orange-hover: #c07a32;
            --danger: #c44b4b;
            --danger-hover: #b03f3f;
            --pink: #e91e63;
            --pink-hover: #d81557;
            --radius: 10px;
            --shadow: 0 8px 28px rgba(0,0,0,0.45);
        }
        * { box-sizing: border-box; }
        body {
            background: radial-gradient(1200px 600px at 50% -10%, #1c2230 0%, var(--bg) 55%);
            color: var(--text);
            font-family: 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif;
            margin: 0;
            padding: 18px 16px 28px;
            text-align: center;
            min-height: 100vh;
        }

        .controls {
            background: linear-gradient(180deg, var(--panel-2), var(--panel));
            border: 1px solid var(--border);
            padding: 14px 16px;
            border-radius: 14px;
            display: inline-flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 4px 6px;
            box-shadow: var(--shadow);
            max-width: 1250px;
            text-align: left;
        }
        .control-group {
            display: inline-block;
            margin: 4px 8px;
            vertical-align: top;
            min-width: 110px;
        }
        .control-group-sep {
            border-left: 1px solid var(--border);
            padding-left: 14px;
            margin-left: 4px;
        }
        .control-group label {
            font-size: 12px;
            color: var(--muted);
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .control-group > label:first-child {
            display: block;
            margin-bottom: 4px;
        }
        .divider {
            width: 1px;
            align-self: stretch;
            background: var(--border);
            margin: 4px 6px;
            min-height: 48px;
        }

        button, .controls input[type="file"]::file-selector-button {
            padding: 7px 12px;
            background: var(--green);
            color: #fff;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            margin-top: 4px;
            transition: background 0.15s, transform 0.1s;
        }
        button:hover { background: var(--green-hover); }
        button:active { transform: scale(0.98); }
        input[type="file"] {
            font-size: 12px;
            color: var(--muted);
            max-width: 160px;
        }
        input[type="range"] {
            vertical-align: middle;
            accent-color: var(--accent);
        }
        input[type="number"] {
            background: #12151c;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 4px;
            padding: 2px 4px;
        }
        #radiusVal, #overlapVal, #cropVal {
            color: var(--accent);
            font-weight: 700;
        }

        .mode-label {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-right: 8px;
            margin-top: 6px;
            font-size: 12px;
            color: var(--text);
            background: rgba(255,255,255,0.04);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid transparent;
        }
        .mode-label:has(input:checked) {
            border-color: var(--accent);
            background: rgba(91,141,239,0.12);
        }
        .toggle-label {
            color: #e6c35c;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 8px;
            margin-right: 12px;
            font-size: 12px;
        }

        .btn-backup { background: var(--accent); }
        .btn-backup:hover { background: var(--accent-hover); }
        .btn-restore { background: var(--orange); }
        .btn-restore:hover { background: var(--orange-hover); }
        
        .btn-automap { background: var(--pink); margin-left: 0; padding: 7px 14px; }
        .btn-automap:hover { background: var(--pink-hover); }

        #ramHint {
            font-size: 11px;
            color: var(--orange);
            margin-top: 6px;
            max-width: 200px;
            line-height: 1.35;
            opacity: 0.9;
        }

        #canvasContainer {
            position: relative;
            display: inline-block;
            margin-top: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            background: #0a0b0e;
        }
        canvas {
            display: block;
            cursor: crosshair;
            width: 900px;
            max-width: 100vw;
            image-rendering: pixelated;
        }

        /* Popup */
        #memoPopup {
            position: absolute;
            display: none;
            background: rgba(22, 25, 34, 0.97);
            border: 1px solid var(--border-soft);
            padding: 0;
            border-radius: 12px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.04) inset;
            z-index: 20;
            width: 260px;
            text-align: left;
            pointer-events: auto;
            overflow: hidden;
            backdrop-filter: blur(8px);
        }
        .img-top {
            width: 100%;
            background: #0d0f14;
            border-bottom: 1px solid var(--border);
            position: relative;
            min-height: 48px;
            cursor: pointer;
        }
        #memoImagePreview {
            display: none;
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            vertical-align: top;
            background: #0d0f14;
        }
        .img-top-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 96px;
            color: #4a5163;
            font-size: 32px;
            font-weight: 200;
            cursor: pointer;
            user-select: none;
            transition: color 0.15s, background 0.15s;
        }
        .img-top-empty:hover {
            color: var(--accent);
            background: rgba(91,141,239,0.06);
        }
        #memoImageInput { display: none; }
        .img-actions {
            margin: 0;
            padding: 6px 10px;
            display: none;
            gap: 6px;
            background: rgba(0,0,0,0.25);
            border-bottom: 1px solid var(--border);
        }
        .img-actions button {
            padding: 4px 10px;
            font-size: 11px;
            background: #3a4050;
            margin-top: 0;
            border-radius: 6px;
        }
        .img-actions button:hover { background: var(--danger); }

        .popup-body { padding: 12px; }
        #memoText {
            width: 100%;
            height: 72px;
            background: #12151c;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 10px;
            resize: vertical;
            font-size: 12px;
            border-radius: 8px;
            font-family: inherit;
            line-height: 1.4;
            transition: border-color 0.15s;
        }
        #memoText:focus, #memoNumber:focus {
            outline: none;
            border-color: var(--accent);
        }
        #memoText::placeholder, #memoNumber::placeholder { color: #5a6275; }
        .num-row { margin-top: 8px; }
        #memoNumber {
            width: 100%;
            background: #12151c;
            color: #f0c14d;
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.05em;
        }
        .btn-group { margin-top: 10px; text-align: right; }
        .btn-close { background: var(--danger); }
        .btn-close:hover { background: var(--danger-hover); }

        /* 미니맵 뷰어 스타일 */
        #minimapViewer {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 320px;
            background: rgba(22, 25, 34, 0.95);
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.04) inset;
            z-index: 100;
            display: none;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(8px);
        }
        .minimap-header {
            background: #0d0f14;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 700;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        .minimap-header button {
            background: transparent;
            color: var(--muted);
            border: none;
            cursor: pointer;
            padding: 4px;
            font-size: 14px;
            margin: 0;
            transition: color 0.15s;
        }
        .minimap-header button:hover { color: var(--danger); }
        #minimapCanvas {
            width: 100%;
            height: auto;
            background: #000;
            display: block;
        }
        .minimap-info {
            padding: 10px 14px;
            font-size: 11px;
            color: var(--text);
            line-height: 1.4;
            background: #12151c;
            border-top: 1px solid var(--border);
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="control-group">
            <label for="imageLoader">맵사진: </label><br>
            <input type="file" id="imageLoader" accept="image/*" style="margin-bottom: 6px;"><br>
            <button onclick="scanBases()">전체맵 결과 스캔</button>
        </div>
        <div class="control-group">
            <label for="baseRadius">베이스 반경: <span id="radiusVal">14</span>px</label><br>
            <input type="range" id="baseRadius" min="5" max="30" value="14" style="width:100px;" oninput="updateRadius(this.value)">
        </div>
        
        <div class="control-group">
            <label for="overlapRatio">겹침 허용도: <span id="overlapVal">0.9</span>배</label><br>
            <input type="range" id="overlapRatio" min="0.5" max="1.6" step="0.1" value="0.9" style="width:100px;" oninput="updateOverlap(this.value)">
        </div>

        <div class="control-group">
            <label for="cropBottom">하단 컷: <span id="cropVal">0</span>px</label><br>
            <input type="range" id="cropBottom" min="0" max="300" value="0" style="width:100px;" oninput="updateCrop(this.value)">
        </div>
        
        <div class="control-group control-group-sep">
            <label>🖱️ 클릭 동작: </label><br>
            <label class="mode-label"><input type="radio" name="clickMode" value="memo" onchange="updateClickMode(this.value)" checked> 📝메모</label>
            <label class="mode-label"><input type="radio" name="clickMode" value="add" onchange="updateClickMode(this.value)"> ➕</label>
            <label class="mode-label"><input type="radio" name="clickMode" value="delete" onchange="updateClickMode(this.value)"> ➖</label>
            <label class="mode-label"><input type="radio" name="clickMode" value="move" onchange="updateClickMode(this.value)"> ↔️ 이동</label>
        </div>

        <div class="control-group control-group-sep">
            <label>🔍 미니맵 영역 (대충 맞추면 스크립트가 알아서 박스 침)</label>
            <div style="font-size:11px; margin-top:4px; display:flex; gap:4px; align-items:center;">
                X: <input type="number" id="mmX" value="79" step="0.5" style="width:48px;" oninput="updateMmUI()">%
                Y: <input type="number" id="mmY" value="1" step="0.5" style="width:48px;" oninput="updateMmUI()">%
            </div>
            <div style="font-size:11px; margin-top:4px; display:flex; gap:4px; align-items:center;">
                W: <input type="number" id="mmW" value="20" step="0.5" style="width:48px;" oninput="updateMmUI()">%
                H: <input type="number" id="mmH" value="20" step="0.5" style="width:48px;" oninput="updateMmUI()">%
            </div>
        </div>

        <div class="control-group control-group-sep">
            <label>백업/복구: </label><br>
            <button class="btn-backup" onclick="exportData()">백업  </button>
            <button class="btn-restore" onclick="document.getElementById('importLoader').click()">  복구</button>
            <input type="file" id="importLoader" accept=".json" style="display:none;" onchange="importData(event)">
            <div id="ramHint" style="font-size:11px;color:#FF9800;margin-top:6px;max-width:200px;line-height:1.3;"></div>
        </div>

        <div class="control-group control-group-sep">
            <br>
            <button class="btn-automap" onclick="document.getElementById('autoMapLoader').click()">📸 스샷 원터치 맵핑</button>
            <input type="file" id="autoMapLoader" accept="image/*" style="display:none;" onchange="handleAutoMap(event)">
        </div>
        <div class="control-group">
            <label class="toggle-label" style="display:block;margin-top:8px;">
                <input type="checkbox" id="autoFrontCrop" checked onchange="updateToggle('autoFrontCrop', this.checked)"> 수동 업로드 앞면 스마트 크롭
            </label>
        </div>
        <div class="control-group">
            <br>
            <label class="toggle-label">
                <input type="checkbox" id="toggleBorder" onchange="updateToggle('toggleBorder', this.checked); redrawCanvas()"> 🟡 테두리
            </label>
            <label class="toggle-label">
                <input type="checkbox" id="toggleMarkers" checked onchange="updateToggle('toggleMarkers', this.checked); redrawCanvas()"> visible
            </label>
        </div>
    </div>

    <div id="canvasContainer">
        <canvas id="mapCanvas"></canvas>
        <div id="memoPopup">
            <div class="img-top" id="imgTopClick">
                <img id="memoImagePreview" alt="미리보기">
                <div class="img-top-empty" id="imgEmptyHint">+</div>
                <input type="file" id="memoImageInput" accept="image/*" style="display:none;">
            </div>
            <div class="img-actions" id="imgActions" style="padding:4px 8px;display:none;">
                <button type="button" onclick="clearMemoImage()">이미지 제거</button>
            </div>
            <div class="popup-body">
                <textarea id="memoText" placeholder="메모"></textarea>
                <div class="num-row">
                    <input type="text" id="memoNumber" placeholder="#" maxlength="4" inputmode="numeric" title="점 위 숫자">
                </div>
            </div>
            <h4 id="memoTitle" style="display:none;"></h4>
            <span id="autoSaveStatus" style="display:none;"></span>
        </div>
    </div>

    <!-- 미니맵 뷰어 컨테이너 -->
    <div id="minimapViewer">
        <div class="minimap-header">
            <span>🔍 미니맵 실시간 뷰어</span>
            <button onclick="closeMinimap()">✖</button>
        </div>
        <canvas id="minimapCanvas"></canvas>
        <div class="minimap-info" id="minimapInfo"></div>
        <div style="padding: 0 14px 12px;">
            <button onclick="executeAutoMap(true)" style="width:100%; background:var(--pink); font-size:12px; padding:8px 0; border-radius:8px;">🎯 이 영역으로 매핑 실행</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const popup = document.getElementById('memoPopup');
        const memoText = document.getElementById('memoText');
        const memoTitle = document.getElementById('memoTitle');
        
        let mapImage = new Image();
        let bases = []; 
        let activeBaseId = null; 
        let currentImageName = "";
        
        let hoveredBase = null;
        let movingSourceBase = null; 
        let pendingImageData = null; 
        let hoverOpenTimer = null;
        let hoverCloseTimer = null;
        let popupPinned = false; 

        const imageStore = new Map(); 
        let imageStoreBytes = 0;
        const numberStore = new Map(); 

        let amOffCanvas = document.createElement('canvas');
        let amCtx = amOffCanvas.getContext('2d', { willReadFrequently: true });
        let amDataCache = null;
        let amWidth = 0;
        let amHeight = 0;
        let amRawDataUrl = null;
        let lastFoundX = -1;
        let lastFoundY = -1;
        
        // 자동으로 감지된 미니맵 검은색 테두리 좌표 저장용
        window.detectedMinimapBounds = null;

        // 페이지 로딩 시 전역(Global) 로컬스토리지에 저장된 미니맵 비율 불러오기
        window.addEventListener('DOMContentLoaded', () => {
            let savedMmX = localStorage.getItem('global_mmX');
            if (savedMmX) document.getElementById('mmX').value = savedMmX;
            let savedMmY = localStorage.getItem('global_mmY');
            if (savedMmY) document.getElementById('mmY').value = savedMmY;
            let savedMmW = localStorage.getItem('global_mmW');
            if (savedMmW) document.getElementById('mmW').value = savedMmW;
            let savedMmH = localStorage.getItem('global_mmH');
            if (savedMmH) document.getElementById('mmH').value = savedMmH;
        });

        function estimateDataUrlBytes(dataUrl) {
            if (!dataUrl) return 0;
            const i = dataUrl.indexOf(',');
            const b64 = i >= 0 ? dataUrl.slice(i + 1) : dataUrl;
            return Math.floor(b64.length * 0.75);
        }

        function parseStoredMemo(baseId) {
            const raw = localStorage.getItem(baseId);
            if (!raw) return { text: '', number: '' };
            try {
                const obj = JSON.parse(raw);
                if (obj && typeof obj === 'object') {
                    if ('t' in obj || 'n' in obj) {
                        return { text: obj.t || '', number: (obj.n != null && obj.n !== '') ? String(obj.n) : '' };
                    }
                    if ('text' in obj || 'image' in obj || 'number' in obj) {
                        return {
                            text: obj.text || '',
                            number: (obj.number != null && obj.number !== '') ? String(obj.number) : ''
                        };
                    }
                }
            } catch (e) {}
            return { text: raw, number: '' };
        }

        function getMemoText(baseId) {
            return parseStoredMemo(baseId).text;
        }

        function getMemoNumber(baseId) {
            if (numberStore.has(baseId)) return numberStore.get(baseId);
            return parseStoredMemo(baseId).number;
        }

        function getMemoData(baseId) {
            const s = parseStoredMemo(baseId);
            const num = numberStore.has(baseId) ? numberStore.get(baseId) : s.number;
            return {
                text: s.text,
                number: num || '',
                image: imageStore.get(baseId) || null
            };
        }

        function setMemoData(baseId, text, image, number) {
            const t = (text || '').trim();
            const n = (number != null ? String(number) : '').trim();

            if (n) numberStore.set(baseId, n);
            else numberStore.delete(baseId);

            if (!t && !n) localStorage.removeItem(baseId);
            else localStorage.setItem(baseId, JSON.stringify({ t: t, n: n }));

            const prev = imageStore.get(baseId);
            if (prev) imageStoreBytes -= estimateDataUrlBytes(prev);
            if (image) {
                imageStore.set(baseId, image);
                imageStoreBytes += estimateDataUrlBytes(image);
            } else {
                imageStore.delete(baseId);
            }
            updateImageRamHint();
        }

        function hasMemo(baseId) {
            const s = parseStoredMemo(baseId);
            const num = numberStore.has(baseId) ? numberStore.get(baseId) : s.number;
            return !!(s.text || num || imageStore.has(baseId));
        }

        function updateImageRamHint() {
            const el = document.getElementById('ramHint');
            if (!el) return;
            const mb = (imageStoreBytes / (1024 * 1024)).toFixed(1);
            el.textContent = `🖼️ RAM 이미지: ${imageStore.size}장 · 약 ${mb}MB (새로고침 시 삭제됨)`;
        }

        function openMemoPopup(base, visualX, visualY) {
            activeBaseId = base.id;
            memoTitle.innerText = `[${base.type} - ${base.iconType}베이스] 좌표: ${base.x}, ${base.y}`;
            const data = getMemoData(base.id);
            memoText.value = data.text;
            const numVal = data.number || '';
            document.getElementById('memoNumber').value = numVal;
            if (numVal) numberStore.set(base.id, numVal);
            pendingImageData = data.image || null;
            const preview = document.getElementById('memoImagePreview');
            const actions = document.getElementById('imgActions');
            const input = document.getElementById('memoImageInput');
            input.value = '';
            const emptyHint = document.getElementById('imgEmptyHint');
            if (pendingImageData) {
                preview.src = pendingImageData;
                preview.style.display = 'block';
                actions.style.display = 'flex';
                if (emptyHint) emptyHint.style.display = 'none';
            } else {
                preview.removeAttribute('src');
                preview.style.display = 'none';
                actions.style.display = 'none';
                if (emptyHint) emptyHint.style.display = 'flex';
            }
            
            const container = document.getElementById('canvasContainer');
            const cRect = container.getBoundingClientRect();
            const OFFSET_X = 12; 
            const OFFSET_Y = 12; 
            popup.style.display = 'block';
            
            popup.style.left = (visualX + OFFSET_X) + 'px';
            popup.style.top = (visualY + OFFSET_Y) + 'px';
            const pw = popup.offsetWidth || 280;
            const ph = popup.offsetHeight || 220;
            let left = visualX + OFFSET_X;
            let top = visualY + OFFSET_Y;
            
            if (left + pw > cRect.width) left = Math.max(0, cRect.width - pw - 4);
            if (top + ph > cRect.height) top = Math.max(0, cRect.height - ph - 4);
            popup.style.left = left + 'px';
            popup.style.top = top + 'px';
            memoText.focus();
        }

        function clearMemoImage() {
            pendingImageData = null;
            document.getElementById('memoImageInput').value = '';
            const preview = document.getElementById('memoImagePreview');
            preview.removeAttribute('src');
            preview.style.display = 'none';
            document.getElementById('imgActions').style.display = 'none';
            const emptyHint = document.getElementById('imgEmptyHint');
            if (emptyHint) emptyHint.style.display = 'flex';
            autoSaveNow();
        }

        function updateRadius(val) {
            document.getElementById('radiusVal').innerText = val;
            if (currentImageName) localStorage.setItem('radius_' + currentImageName, val);
            redrawCanvas();
        }

        function updateOverlap(val) {
            document.getElementById('overlapVal').innerText = val;
            if (currentImageName) localStorage.setItem('overlap_' + currentImageName, val);
        }

        function updateCrop(val) {
            document.getElementById('cropVal').innerText = val;
            if (currentImageName) localStorage.setItem('crop_' + currentImageName, val);
            redrawCanvas();
        }

        function updateClickMode(mode) {
            if (currentImageName) localStorage.setItem('clickMode_' + currentImageName, mode);
            movingSourceBase = null; 
            closePopup(); 
            redrawCanvas();
        }

        function updateToggle(id, isChecked) {
            if (currentImageName) localStorage.setItem(id + '_' + currentImageName, isChecked);
        }

        // 미니맵 전역 세팅 저장

        function redrawCanvas() {
            if (!mapImage.src) return;
            ctx.drawImage(mapImage, 0, 0);
            
            const cropBottom = parseInt(document.getElementById('cropBottom').value) || 0;
            if (cropBottom > 0) {
                const lineY = canvas.height - cropBottom;
                ctx.beginPath(); ctx.moveTo(0, lineY); ctx.lineTo(canvas.width, lineY);
                ctx.strokeStyle = 'rgba(255, 0, 0, 0.8)'; ctx.lineWidth = 2; ctx.setLineDash([8, 6]); 
                ctx.stroke(); ctx.setLineDash([]);

        function renderBases() {
            const R = parseInt(document.getElementById('baseRadius').value);
            const showBorder = document.getElementById('toggleBorder').checked;

            bases.forEach(base => {
                ctx.beginPath(); 
                ctx.arc(base.x, base.y, R, 0, 2 * Math.PI);
                
                if (showBorder) {
                    ctx.strokeStyle = '#FFFF00'; 
                    ctx.lineWidth = 2; 
                    ctx.stroke();
                }
                
                if (hoveredBase && hoveredBase.id === base.id) {
                    ctx.fillStyle = 'rgba(210, 180, 140, 0.65)'; 
                    ctx.fill();
                    
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)'; 
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                if (movingSourceBase && movingSourceBase.id === base.id) {
                    ctx.beginPath();
                    ctx.arc(base.x, base.y, R + 4, 0, 2 * Math.PI);
                    ctx.strokeStyle = '#5b8def';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([4, 4]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    
                    ctx.fillStyle = 'rgba(91, 141, 239, 0.25)';
                    ctx.fill();
                }

                let iconEmoji = "";
                if (base.iconType === "홈") iconEmoji = "";
                else if (base.iconType === "비행기") iconEmoji = "";
                else if (base.iconType === "헬기") iconEmoji = "";

                if (iconEmoji !== "") {
                    ctx.font = `${Math.max(12, R + 2)}px Arial`;
                    ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.shadowColor = "black"; ctx.shadowBlur = 4;
                    ctx.fillStyle = "white";
                    ctx.fillText(iconEmoji, base.x, base.y);
                    ctx.shadowBlur = 0; 
                }
                
                const md = getMemoData(base.id);
                if (hasMemo(base.id)) {
                    ctx.beginPath(); 
                    ctx.arc(base.x + R/1.5, base.y - R/1.5, 4, 0, 2 * Math.PI);
                    ctx.fillStyle = md.image ? '#FF9800' : (md.number ? '#FFCC80' : '#FF0000');
                    ctx.fill();
                    if (md.image) {
                        ctx.beginPath();
                        ctx.arc(base.x + R/1.5, base.y - R/1.5, 4, 0, 2 * Math.PI);
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
                
                if (md.number) {
                    const label = String(md.number);
                    const fontSize = Math.max(14, Math.floor(R * 1.15));
                    ctx.save();
                    ctx.font = `bold ${fontSize}px "Malgun Gothic", Arial, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    ctx.lineJoin = 'round';
                    ctx.lineWidth = Math.max(3, fontSize * 0.28);
                    ctx.strokeStyle = 'rgba(0,0,0,0.92)';
                    ctx.strokeText(label, base.x, base.y);
                    
                    ctx.fillStyle = (base.type === '갈색') ? '#FFEB3B' : '#FFFFFF';
                    ctx.fillText(label, base.x, base.y);
                    ctx.restore();
                }
            });
        }

        function identifyIcon(cx, cy, R, data, width, height) {
            let k = Math.floor(R * 0.65);
            if (k < 3) return "일반"; 

            let totalHoles = 0;
            let cols = [0, 0, 0], diag1 = [0, 0, 0], diag2 = [0, 0, 0];

            for (let dy = -k; dy <= k; dy++) {
                for (let dx = -k; dx <= k; dx++) {
                    let x = Math.round(cx + dx), y = Math.round(cy + dy);
                    if (x < 0 || x >= width || y < 0 || y >= height) continue;
                    let idx = (y * width + x) * 4;
                    let r = data[idx], g = data[idx+1], b = data[idx+2];

                    if (r < 75 && g < 75 && b < 75) {
                        totalHoles++;
                        let cIdx = dx < -k/3 ? 0 : (dx > k/3 ? 2 : 1); cols[cIdx]++;
                        let d1 = dx + dy, d1Idx = d1 < -k/2 ? 0 : (d1 > k/2 ? 2 : 1); diag1[d1Idx]++;
                        let d2 = dx - dy, d2Idx = d2 < -k/2 ? 0 : (d2 > k/2 ? 2 : 1); diag2[d2Idx]++;
                    }
                }
            }

            let area = (2 * k + 1) * (2 * k + 1);
            if (totalHoles < area * 0.08) return "일반"; 

            let pL = cols[0] / totalHoles, pC = cols[1] / totalHoles, pR = cols[2] / totalHoles;
            let pD1 = diag1[1] / totalHoles, pD2 = diag2[1] / totalHoles;

            if (pL > 0 && pR > 0 && pC < 0.50) return "홈"; 
            else if (pC > 0.50) return "헬기"; 
            else if (pD1 > 0.45 || pD2 > 0.45) return "비행기"; 
            return "일반";
        }

        function scanBases() {
            if (!mapImage.src) return alert("이미지부터 올려라");
            
            bases = [];
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            
            const R = parseInt(document.getElementById('baseRadius').value);
            const cropBottom = parseInt(document.getElementById('cropBottom').value); 
            const overlapRatio = parseFloat(document.getElementById('overlapRatio').value);

            const R_sq = R * R;
            const gridStep = 4, checkStep = 2;  

            const maxPossibleScore = (Math.PI * R_sq) / (checkStep * checkStep);
            const threshold = maxPossibleScore * 0.35; 
            const minQuadrantScore = maxPossibleScore * 0.03; 

            let candidates = [];
            const scanLimitY = canvas.height - R - cropBottom;

            for (let y = R; y < scanLimitY; y += gridStep) {
                for (let x = R; x < canvas.width - R; x += gridStep) {
                    
                    let scoreBlue = 0, scoreBrown = 0, scoreGreen = 0, scoreRed = 0;
                    let qBlue = [0,0,0,0], qBrown = [0,0,0,0], qGreen = [0,0,0,0], qRed = [0,0,0,0]; 

                    for (let dy = -R; dy <= R; dy += checkStep) {
                        for (let dx = -R; dx <= R; dx += checkStep) {
                            if (dx * dx + dy * dy <= R_sq) {
                                let cx = x + dx, cy = y + dy;
                                let idx = (cy * canvas.width + cx) * 4;
                                let r = data[idx], g = data[idx+1], b = data[idx+2];
                                let qIdx = (dx < 0 ? 0 : 1) + (dy < 0 ? 0 : 2); 

                                if (b > 100 && b > r * 1.2 && b > g * 1.2) {
                                    scoreBlue++; qBlue[qIdx]++;
                                } 
                                else if (g > 80 && g > r * 1.2 && g > b * 1.2) {
                                    scoreGreen++; qGreen[qIdx]++;
                                }
                                else if (r > 120 && r > g * 1.6 && r > b * 1.6) {
                                    scoreRed++; qRed[qIdx]++;
                                }
                                else if (r > 60 && r < 170 && g > 30 && g < 100 && b < 90 && r > g * 1.35 && r > b * 1.4) {
                                    scoreBrown++; qBrown[qIdx]++;
                                } 
                            }
                        }
                    }

                    let maxScore = Math.max(scoreBlue, scoreBrown, scoreGreen, scoreRed);
                    if (maxScore > threshold) {
                        let type, qData;
                        if (maxScore === scoreBlue) { type = "파랑"; qData = qBlue; }
                        else if (maxScore === scoreBrown) { type = "갈색"; qData = qBrown; }
                        else if (maxScore === scoreGreen) { type = "초록"; qData = qGreen; }
                        else { type = "빨강"; qData = qRed; }
                        
                        let validQuadrants = 0;
                        for(let qi = 0; qi < 4; qi++) {
                            if(qData[qi] >= minQuadrantScore) validQuadrants++;
                        }

                        if (validQuadrants >= 3) {
                            candidates.push({ x, y, score: maxScore, type });
                        }
                    }
                }
            }

            candidates.sort((a, b) => b.score - a.score);
            const MIN_DIST_SQ = (R * overlapRatio) * (R * overlapRatio); 

            for (let c of candidates) {
                let keep = true;
                for (let fb of bases) {
                    let dx = c.x - fb.x, dy = c.y - fb.y;
                    if (dx * dx + dy * dy < MIN_DIST_SQ) { keep = false; break; }
                }
                
                if (keep) {
                    let icon = identifyIcon(c.x, c.y, R, data, canvas.width, canvas.height);
                    bases.push({
                        id: `base_${c.x}_${c.y}`, x: c.x, y: c.y, type: c.type, iconType: icon
                    });
                }
            }

            document.getElementById('toggleMarkers').checked = true;
            updateToggle('toggleMarkers', true);
            
            bases.forEach(b => {
                const n = parseStoredMemo(b.id).number;
                if (n) numberStore.set(b.id, n);
            });
            
            redrawCanvas(); 
            setTimeout(() => alert(`스캔 완료. 총 ${bases.length}개 찾음.`), 150);
        }

        function renderMinimapPreview() {
            if (!amDataCache) return;
            
            let mmPctX = parseFloat(document.getElementById('mmX').value) || 79;
            let mmPctY = parseFloat(document.getElementById('mmY').value) || 1;
            let mmPctW = parseFloat(document.getElementById('mmW').value) || 20;
            let mmPctH = parseFloat(document.getElementById('mmH').value) || 20;

            let mmMinX = Math.floor(amWidth * (mmPctX / 100));
            let mmMinY = Math.floor(amHeight * (mmPctY / 100));
            let mmMaxX = Math.floor(amWidth * ((mmPctX + mmPctW) / 100));
            let mmMaxY = Math.floor(amHeight * ((mmPctY + mmPctH) / 100));

            mmMinX = Math.max(0, Math.min(mmMinX, amWidth - 1));
            mmMinY = Math.max(0, Math.min(mmMinY, amHeight - 1));
            mmMaxX = Math.max(mmMinX + 10, Math.min(mmMaxX, amWidth));
            mmMaxY = Math.max(mmMinY + 10, Math.min(mmMaxY, amHeight));

            const mmW = mmMaxX - mmMinX;
            const mmH = mmMaxY - mmMinY;

            // 🚨 미니맵의 실제 검은색 테두리(박스)를 찾아내는 로직 🚨
            let bMinX = mmMaxX, bMinY = mmMaxY, bMaxX = mmMinX, bMaxY = mmMinY;
            let blackCount = 0;
            for (let y = mmMinY; y <= mmMaxY; y++) {
                for (let x = mmMinX; x <= mmMaxX; x++) {
                    let i = (y * amWidth + x) * 4;
                    // 검은색 픽셀에 가까운지 판단 (압축 손실 고려해 35 이하로 설정)
                    if (amDataCache[i] < 35 && amDataCache[i+1] < 35 && amDataCache[i+2] < 35) {
                        if (x < bMinX) bMinX = x;
                        if (x > bMaxX) bMaxX = x;
                        if (y < bMinY) bMinY = y;
                        if (y > bMaxY) bMaxY = y;
                        blackCount++;
                    }
                }
            }

            const mCanvas = document.getElementById('minimapCanvas');
            mCanvas.width = mmW;
            mCanvas.height = mmH;
            const mCtx = mCanvas.getContext('2d');
            
            // 먼저 원본 영역을 그린다
            mCtx.drawImage(amOffCanvas, mmMinX, mmMinY, mmW, mmH, 0, 0, mmW, mmH);
            
            window.detectedMinimapBounds = null;
            let detectText = `<span style="color:var(--muted);font-size:10px;">(지정한 영역: ${mmW}x${mmH})</span>`;

            // 검은색 영역이 유의미한 크기(가로세로 20px 이상)로 인식되었다면, 이 영역을 진짜 미니맵으로 간주함
            if (blackCount > 50 && (bMaxX - bMinX) > 20 && (bMaxY - bMinY) > 20) {
                window.detectedMinimapBounds = { minX: bMinX, minY: bMinY, maxX: bMaxX, maxY: bMaxY };
                
                // 뷰어 안에 하늘색 점선으로 인식된 테두리를 박스쳐서 보여줌
                mCtx.beginPath();
                mCtx.rect(bMinX - mmMinX, bMinY - mmMinY, bMaxX - bMinX, bMaxY - bMinY);
                mCtx.strokeStyle = '#00ffff';
                mCtx.lineWidth = 1;
                mCtx.setLineDash([4, 4]);
                mCtx.stroke();
                mCtx.setLineDash([]);
                
                detectText = `<span style="color:#00ffff;font-size:11px;font-weight:bold;">✅ 미니맵 테두리 완벽 인식됨 (하늘색 박스)</span>`;
            }

            let rx = -1, ry = -1;
            let bestScore = -1;
            
            for (let y = mmMinY + 6; y <= mmMaxY - 6; y++) {
                for (let x = mmMinX + 6; x <= mmMaxX - 6; x++) {
                    let i = (y * amWidth + x) * 4;
                    let r = amDataCache[i], g = amDataCache[i+1], b = amDataCache[i+2];
                    
                    if (r > 60 && r > g * 1.3 && r > b * 1.3) {
                        let redMass = 0, goldMass = 0;
                        for(let dy = -2; dy <= 2; dy++) {
                            for(let dx = -2; dx <= 2; dx++) {
                                let idx = ((y + dy) * amWidth + (x + dx)) * 4;
                                let tr = amDataCache[idx], tg = amDataCache[idx+1], tb = amDataCache[idx+2];
                                if (tr > 60 && tr > tg * 1.3 && tr > tb * 1.3) redMass++;
                            }
                        }
                        for(let dy = -6; dy <= 6; dy++) {
                            for(let dx = -6; dx <= 6; dx++) {
                                if (Math.abs(dx) > 2 || Math.abs(dy) > 2) { 
                                    let idx = ((y + dy) * amWidth + (x + dx)) * 4;
                                    let tr = amDataCache[idx], tg = amDataCache[idx+1], tb = amDataCache[idx+2];
                                    if (tr > 80 && tg > 70 && tb < tr * 0.8 && tb < tg * 0.9) goldMass++;
                                }
                            }
                        }
                        if (redMass > 6 && goldMass > 15) {
                            let score = (redMass * 3) + goldMass; 
                            if (score > bestScore) {
                                bestScore = score;
                                rx = x; ry = y;
                            }
                        }
                    }
                }
            }

            if (rx === -1) {
                let redSumX = 0, redSumY = 0, redCount = 0;
                let localMaxRed = 0;
                
                for (let y = mmMinY; y <= mmMaxY; y++) {
                    for (let x = mmMinX; x <= mmMaxX; x++) {
                        let i = (y * amWidth + x) * 4;
                        let r = amDataCache[i], g = amDataCache[i+1], b = amDataCache[i+2];
                        if (r > 120 && r > g * 2.0 && r > b * 2.0) {
                            let score = r - g - b;
                            if (score > localMaxRed) localMaxRed = score;
                        }
                    }
                }
                
                if (localMaxRed > 50) {
                    for (let y = mmMinY; y <= mmMaxY; y++) {
                        for (let x = mmMinX; x <= mmMaxX; x++) {
                            let i = (y * amWidth + x) * 4;
                            let r = amDataCache[i], g = amDataCache[i+1], b = amDataCache[i+2];
                            if (r > 120 && r > g * 2.0 && r > b * 2.0) {
                                let score = r - g - b;
                                if (score >= localMaxRed * 0.85) {
                                    redSumX += x;
                                    redSumY += y;
                                    redCount++;
                                }
                            }
                        }
                    }
                    if (redCount > 0) {
                        rx = Math.round(redSumX / redCount);
                        ry = Math.round(redSumY / redCount);
                    }
                }
            }

            if (rx !== -1) {
                mCtx.beginPath();
                mCtx.arc(rx - mmMinX, ry - mmMinY, 5, 0, 2 * Math.PI);
                mCtx.strokeStyle = '#00FF00';
                mCtx.lineWidth = 2;
                mCtx.stroke();
                
                mCtx.beginPath();
                mCtx.moveTo(rx - mmMinX - 12, ry - mmMinY);
                mCtx.lineTo(rx - mmMinX + 12, ry - mmMinY);
                mCtx.moveTo(rx - mmMinX, ry - mmMinY - 12);
                mCtx.lineTo(rx - mmMinX, ry - mmMinY + 12);
                mCtx.strokeStyle = '#00FF00';
                mCtx.lineWidth = 1.5;
                mCtx.stroke();
                
                lastFoundX = rx;
                lastFoundY = ry;
            } else {
                lastFoundX = -1;
                lastFoundY = -1;
            }

            document.getElementById('minimapInfo').innerHTML = 
                detectText + `<br>` + 
                (rx !== -1 
                    ? `<span style="color:#00FF00;font-size:12px;font-weight:bold;margin-top:4px;display:inline-block;">🎯 내 위치(십자선) 감지됨!</span>` 
                    : `<span style="color:var(--danger);font-size:12px;font-weight:bold;margin-top:4px;display:inline-block;">❌ 내 위치 못 찾음. 영역을 더 조절해봐.</span>`);
        }

        function executeAutoMap(showAlert) {
            if (!amDataCache) {
                if(showAlert) alert("먼저 [스샷 원터치 맵핑] 버튼으로 스크린샷을 업로드해주세요.");
                return;
            }

            let mmPctX = parseFloat(document.getElementById('mmX').value) || 79;
            let mmPctY = parseFloat(document.getElementById('mmY').value) || 1;
            let mmPctW = parseFloat(document.getElementById('mmW').value) || 20;
            let mmPctH = parseFloat(document.getElementById('mmH').value) || 20;

            let mmMinX = Math.floor(amWidth * (mmPctX / 100));
            let mmMinY = Math.floor(amHeight * (mmPctY / 100));
            let mmMaxX = Math.floor(amWidth * ((mmPctX + mmPctW) / 100));
            let mmMaxY = Math.floor(amHeight * ((mmPctY + mmPctH) / 100));

            mmMinX = Math.max(0, Math.min(mmMinX, amWidth - 1));
            mmMinY = Math.max(0, Math.min(mmMinY, amHeight - 1));
            mmMaxX = Math.max(mmMinX + 10, Math.min(mmMaxX, amWidth));
            mmMaxY = Math.max(mmMinY + 10, Math.min(mmMaxY, amHeight));

            // 🚨 만약 검은색 미니맵 테두리가 감지되었다면, 그 정확한 박스를 기준으로 비율을 잰다 🚨
            let finalMinX = mmMinX;
            let finalMinY = mmMinY;
            let finalMaxX = mmMaxX;
            let finalMaxY = mmMaxY;
            
            if (window.detectedMinimapBounds) {
                finalMinX = window.detectedMinimapBounds.minX;
                finalMinY = window.detectedMinimapBounds.minY;
                finalMaxX = window.detectedMinimapBounds.maxX;
                finalMaxY = window.detectedMinimapBounds.maxY;
            }

            if (lastFoundX === -1) {
                if(showAlert) alert('설정된 미니맵 뷰어 영역 안에서 현재 위치(초록 십자선/빨간점)를 찾지 못했습니다.\n입력칸을 조절해서 미니맵이 잘 보이게 맞춰주세요.');
                return;
            }

            let pctX = (lastFoundX - finalMinX) / (finalMaxX - finalMinX);
            let pctY = (lastFoundY - finalMinY) / (finalMaxY - finalMinY);
            
            // 에러 방지용
            if (finalMaxX <= finalMinX) pctX = 0;
            if (finalMaxY <= finalMinY) pctY = 0;
            
            let targetX = canvas.width * pctX;
            let targetY = canvas.height * pctY;

            let closestBase = null;
            let minDist = Infinity;
            bases.forEach(b => {
                let d = Math.hypot(b.x - targetX, b.y - targetY);
                if (d < minDist) { 
                    minDist = d; 
                    closestBase = b; 
                }
            });

            if (!closestBase || minDist > canvas.width * 0.15) {
                if(showAlert) alert('미니맵 비율과 일치하는 스캔된 베이스를 캔버스 안에서 찾을 수 없습니다.');
                return;
            }

            smartCropFrontFace(amRawDataUrl, 900).then(cropped => {
                const prevText = getMemoText(closestBase.id);
                const prevNum = getMemoNumber(closestBase.id);
                setMemoData(closestBase.id, prevText, cropped, prevNum);
                
                document.getElementById('toggleMarkers').checked = true;
                updateToggle('toggleMarkers', true);
                
                redrawCanvas(); 
                if(showAlert) {
                    setTimeout(() => alert(`🎯 매핑 완료!\n(미니맵 좌표: 가로 ${Math.round(pctX*100)}%, 세로 ${Math.round(pctY*100)}%)\n스마트 크롭된 사진이 가장 가까운 [${closestBase.type}] 베이스에 등록되었습니다.`), 150);
                }
            });
        }

        function smartCropFrontFace(dataUrl, maxOut) {
            maxOut = maxOut || 960;
            return new Promise(function(resolve, reject) {
                const img = new Image();
                img.onload = function() {
                    const w = img.naturalWidth || img.width;
                    const h = img.naturalHeight || img.height;
                    if (w < 48 || h < 48) { resolve(dataUrl); return; }

                    const aw = 400;
                    const ah = Math.max(80, Math.round(400 * h / w));
                    const ac = document.createElement('canvas');
                    ac.width = aw; ac.height = ah;
                    const actx = ac.getContext('2d', { willReadFrequently: true });
                    actx.drawImage(img, 0, 0, aw, ah);
                    
                    let data;
                    try { data = actx.getImageData(0, 0, aw, ah).data; }
                    catch (err) { resolve(dataUrl); return; }

                    let signX = 0, signY = 0, signCount = 0;
                    let wallX = 0, wallY = 0, wallCount = 0;
                    let edgeX = 0, edgeY = 0, edgeCount = 0;
                    const gray = new Float32Array(aw * ah);

                    for (let y = 0; y < ah; y++) {
                        for (let x = 0; x < aw; x++) {
                            let i = (y * aw + x) * 4;
                            let r = data[i], g = data[i+1], b = data[i+2];
                            gray[i] = 0.3*r + 0.59*g + 0.11*b;

                            if (r > 120 && g > 70 && b < 90 && r > g * 1.2 && r > b * 1.5) {
                                let localGrayCount = 0;
                                
                                for (let dy = -15; dy <= 15; dy += 3) {
                                    for (let dx = -15; dx <= 15; dx += 3) {
                                        let nx = x + dx, ny = y + dy;
                                        if (nx >= 0 && nx < aw && ny >= 0 && ny < ah) {
                                            let ni = (ny * aw + nx) * 4;
                                            let nr = data[ni], ng = data[ni+1], nb = data[ni+2];
                                            let maxC = Math.max(nr, ng, nb);
                                            let minC = Math.min(nr, ng, nb);
                                            
                                            if ((maxC - minC) < 25 && maxC > 40 && maxC < 140) {
                                                localGrayCount++;
                                            }
                                        }
                                    }
                                }
                                
                                if (localGrayCount >= 6) {
                                    signX += x;
                                    signY += y;
                                    signCount++;
                                }
                            }

                            if (y > ah * 0.10 && y < ah * 0.90 && x > aw * 0.10 && x < aw * 0.90) {
                                let maxRGB = Math.max(r, g, b);
                                let minRGB = Math.min(r, g, b);
                                if (maxRGB - minRGB < 22 && maxRGB > 45 && maxRGB < 135) {
                                    wallX += x;
                                    wallY += y;
                                    wallCount++;
                                }
                                if (x > 0 && y > 0) {
                                    const e = Math.abs(gray[i] - gray[i-1]) + Math.abs(gray[i] - gray[i-aw]);
                                    if (e > 30) {
                                        edgeX += x;
                                        edgeY += y;
                                        edgeCount++;
                                    }
                                }
                            }
                        }
                    }

                    let targetX, targetY;
                    
                    if (signCount > 5) {
                        targetX = (signX / signCount) / aw * w;
                        targetY = (signY / signCount) / ah * h;
                    } else if (wallCount > 50) {
                        let centerX = (wallX / wallCount) / aw * w;
                        let centerY = (wallY / wallCount) / ah * h;
                        targetX = centerX; 
                        targetY = centerY;
                    } else if (edgeCount > 100) {
                        let centerX = (edgeX / edgeCount) / aw * w;
                        let centerY = (edgeY / edgeCount) / ah * h;
                        targetX = centerX;
                        targetY = centerY;
                    } else {
                        targetX = w / 2;
                        targetY = h / 2;
                    }

                    let cw = Math.round(w * 0.42);
                    let ch = Math.round(h * 0.50);
                    
                    let x0 = Math.round(targetX - cw / 2);
                    let y0 = Math.round(targetY - ch / 2);
                    
                    if (x0 < 0) x0 = 0;
                    if (y0 < 0) y0 = 0;
                    if (x0 + cw > w) { x0 = w - cw; if (x0 < 0) { x0 = 0; cw = w; } }
                    if (y0 + ch > h) { y0 = h - ch; if (y0 < 0) { y0 = 0; ch = h; } }

                    const scale = Math.min(1, maxOut / Math.max(cw, ch));
                    const ow = Math.max(1, Math.round(cw * scale));
                    const oh = Math.max(1, Math.round(ch * scale));
                    
                    const out = document.createElement('canvas');
                    out.width = ow; 
                    out.height = oh;
                    const octx = out.getContext('2d');
                    octx.imageSmoothingEnabled = true;
                    octx.imageSmoothingQuality = 'high';
                    octx.drawImage(img, x0, y0, cw, ch, 0, 0, ow, oh);
                    
                    try { resolve(out.toDataURL('image/jpeg', 0.90)); }
                    catch (err) { resolve(dataUrl); }
                };
                img.onerror = function() { reject(new Error('image load fail')); };
                img.src = dataUrl;
            });
        }

        canvas.addEventListener('click', function(e) {
            if (!mapImage.src) return;
            
            const rect = canvas.getBoundingClientRect();
            const visualX = e.clientX - rect.left;
            const visualY = e.clientY - rect.top;
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const internalX = visualX * scaleX;
            const internalY = visualY * scaleY;
            const R = parseInt(document.getElementById('baseRadius').value);
            
            const detectRadius = R * 1.8;

            let clickedBaseIndex = bases.findIndex(base => Math.hypot(base.x - internalX, base.y - internalY) < detectRadius);
            let clickedBase = clickedBaseIndex !== -1 ? bases[clickedBaseIndex] : null;

            const mode = document.querySelector('input[name="clickMode"]:checked').value;

            if (mode === 'memo') {
                if (clickedBase) {
                    openMemoPopup(clickedBase, visualX, visualY);
                    popupPinned = true;
                } else { 
                    closePopup(); 
                }
            } 
            else if (mode === 'add') {
                closePopup();
                let newX = Math.round(internalX);
                let newY = Math.round(internalY);
                bases.push({
                    id: `base_${newX}_${newY}_m`, 
                    x: newX, 
                    y: newY, 
                    type: "수동", 
                    iconType: "일반"
                });
                redrawCanvas();
            } 
            else if (mode === 'delete') {
                closePopup();
                if (clickedBaseIndex !== -1) {
                    setMemoData(bases[clickedBaseIndex].id, "", null, ""); // 데이터 완벽 삭제
                    bases.splice(clickedBaseIndex, 1);
                    hoveredBase = null;
                    redrawCanvas();
                }
            }
            else if (mode === 'move') {
                closePopup();
                if (!movingSourceBase) {
                    if (clickedBase) {
                        movingSourceBase = clickedBase;
                        redrawCanvas();
                    }
                } else {
                    if (clickedBase) {
                        if (clickedBase.id === movingSourceBase.id) {
                            movingSourceBase = null;
                        } else {
                            let srcData = getMemoData(movingSourceBase.id);
                            setMemoData(clickedBase.id, srcData.text, srcData.image, srcData.number);
                            setMemoData(movingSourceBase.id, "", null, "");
                            movingSourceBase = null;
                        }
                    } else {
                        let oldId = movingSourceBase.id;
                        let newX = Math.round(internalX);
                        let newY = Math.round(internalY);
                        let newId = `base_${newX}_${newY}_m`;
                        
                        let srcData = getMemoData(oldId);
                        setMemoData(newId, srcData.text, srcData.image, srcData.number);
                        setMemoData(oldId, "", null, "");
                        
                        movingSourceBase.x = newX;
                        movingSourceBase.y = newY;
                        movingSourceBase.id = newId;
                        movingSourceBase.type = "수동";
                        
                        movingSourceBase = null;
                    }
                    redrawCanvas();

                    const memoRadio = document.querySelector('input[name="clickMode"][value="memo"]');
                    if(memoRadio) {
                        memoRadio.checked = true;
                        updateClickMode('memo');
                    }
                }
            }
        });

        function exportData() {
            if (!mapImage.src) return alert("백업할 지도가 없다.");

            const images = {};
            imageStore.forEach((v, k) => { images[k] = v; });

            const memos = {};
            const seen = new Set();
            bases.forEach(b => seen.add(b.id));
            imageStore.forEach((_, k) => seen.add(k));
            numberStore.forEach((_, k) => seen.add(k));
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('base_')) seen.add(key);
            }
            seen.forEach(id => {
                const parsed = parseStoredMemo(id);
                const n = numberStore.has(id) ? numberStore.get(id) : parsed.number;
                const t = parsed.text || '';
                if (t || n) memos[id] = { t: t, n: n || '' };
            });

            const settings = collectSettings();

            const localStorageData = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const val = localStorage.getItem(key);
                if (val && val.length > 500000 && val.indexOf('data:image') !== -1) continue;
                localStorageData[key] = val;
            }

            const dump = {
                version: 3,
                app: 'tactical_map_memo',
                exportedAt: new Date().toISOString(),
                imageSrc: mapImage.src,
                currentImageName: currentImageName || 'map',
                canvasWidth: canvas.width,
                canvasHeight: canvas.height,
                bases: bases,
                settings: settings,
                memos: memos,
                images: images,
                localStorageData: localStorageData
            };

            const json = JSON.stringify(dump);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
            a.download = 'tactical_map_backup_' + stamp + '.json';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 2000);
            
            setTimeout(() => alert('백업 완료 (약 ' + (blob.size / (1024 * 1024)).toFixed(1) + 'MB)\n베이스 ' + bases.length + ' · 메모 ' + Object.keys(memos).length + ' · 이미지 ' + imageStore.size + '장\n설정/좌표/숫자 포함 — 다른 기기에서 복구 가능'), 150);
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const dump = JSON.parse(ev.target.result);

                    if (dump.localStorageData && typeof dump.localStorageData === 'object') {
                        for (const key in dump.localStorageData) {
                            const val = dump.localStorageData[key];
                            if (val && val.length > 500000 && val.indexOf('data:image') !== -1) continue;
                            try { localStorage.setItem(key, val); } catch (err) {}
                        }
                    }

                    numberStore.clear();
                    if (dump.memos && typeof dump.memos === 'object') {
                        for (const id in dump.memos) {
                            const m = dump.memos[id];
                            if (!m) continue;
                            const t = (m.t != null ? m.t : (m.text || '')) || '';
                            const n = (m.n != null ? m.n : (m.number || '')) || '';
                            if (n) numberStore.set(id, String(n));
                            if (t || n) {
                                try { localStorage.setItem(id, JSON.stringify({ t: t, n: n })); } catch (err) {}
                            }
                        }
                    }

                    imageStore.clear();
                    imageStoreBytes = 0;
                    const imgs = dump.images || {};
                    for (const key in imgs) {
                        if (imgs[key]) {
                            imageStore.set(key, imgs[key]);
                            imageStoreBytes += estimateDataUrlBytes(imgs[key]);
                        }
                    }
                    
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        if (!key || !key.startsWith('base_')) continue;
                        const raw = localStorage.getItem(key);
                        try {
                            const obj = JSON.parse(raw);
                            if (obj && obj.image) {
                                if (!imageStore.has(key)) {
                                    imageStore.set(key, obj.image);
                                    imageStoreBytes += estimateDataUrlBytes(obj.image);
                                }
                                const t = obj.t || obj.text || '';
                                const n = obj.n || obj.number || '';
                                localStorage.setItem(key, JSON.stringify({ t: t, n: n }));
                                if (n) numberStore.set(key, String(n));
                            }
                        } catch (err) {}
                    }
                    
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        if (!key || !key.startsWith('base_')) continue;
                        if (numberStore.has(key)) continue;
                        const n = parseStoredMemo(key).number;
                        if (n) numberStore.set(key, n);
                    }
                    updateImageRamHint();

                    if (dump.imageSrc) {
                        currentImageName = dump.currentImageName || 'restored_map';
                        bases = Array.isArray(dump.bases) ? dump.bases : [];

                        mapImage.onload = function() {
                            canvas.width = mapImage.width || dump.canvasWidth || mapImage.naturalWidth;
                            canvas.height = mapImage.height || dump.canvasHeight || mapImage.naturalHeight;
                            
                            if (dump.settings) applySettings(dump.settings);
                            else loadAllSettings();
                            
                            bases.forEach(b => {
                                const n = parseStoredMemo(b.id).number;
                                if (n) numberStore.set(b.id, n);
                            });
                            closePopup();
                            
                            redrawCanvas();
                            setTimeout(() => alert('복구 완료\n베이스 ' + bases.length + ' · 메모/숫자 반영 · 이미지 ' + imageStore.size + '장'), 150);
                        };
                        mapImage.onerror = function() {
                            alert('지도 이미지 복원 실패. 백업 파일이 손상되었을 수 있습니다.');
                        };
                        mapImage.src = dump.imageSrc;
                    } else if (dump.bases) {
                        bases = dump.bases || [];
                        if (dump.settings) applySettings(dump.settings);
                        bases.forEach(b => {
                            const n = parseStoredMemo(b.id).number;
                            if (n) numberStore.set(b.id, n);
                        });
                        
                        redrawCanvas();
                        setTimeout(() => alert('데이터 복구 완료 (지도 이미지 없음). 이미지 ' + imageStore.size + '장'), 150);
                    } else {
                        for (const key in dump) {
                            if (key === 'version' || key === 'app') continue;
                            try { localStorage.setItem(key, typeof dump[key] === 'string' ? dump[key] : JSON.stringify(dump[key])); } catch (err) {}
                        }
                        
                        redrawCanvas();
                        setTimeout(() => alert('구버전 백업 복구 시도 완료.'), 150);
                    }
                } catch (err) {
                    console.error(err);
                    alert('백업 파일 오류: ' + (err && err.message ? err.message : '파싱 실패'));
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }
    </script>
</body>
</html>
