<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>전술 지도 메모장 (호버 메모+이미지)</title>
    <style>
        :root {
            --bg: #12141a;
            --panel: #1a1d26;
            --panel-2: #222632;
            --border: #2e3444;
            --border-soft: #3a4155;
            --text: #e8eaef;
            --muted: #8b93a7;
            --accent: #5b8def;
            --accent-hover: #4a7de0;
            --green: #3d9b6e;
            --green-hover: #348a60;
            --orange: #d4893a;
            --orange-hover: #c07a32;
            --danger: #c44b4b;
            --danger-hover: #b03f3f;
            --radius: 10px;
            --shadow: 0 8px 28px rgba(0,0,0,0.45);
        }
        * { box-sizing: border-box; }
        body {
            background: radial-gradient(1200px 600px at 50% -10%, #1c2230 0%, var(--bg) 55%);
            color: var(--text);
            font-family: 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif;
            margin: 0;
            padding: 18px 16px 28px;
            text-align: center;
            min-height: 100vh;
        }

        .controls {
            background: linear-gradient(180deg, var(--panel-2), var(--panel));
            border: 1px solid var(--border);
            padding: 14px 16px;
            border-radius: 14px;
            display: inline-flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 4px 6px;
            box-shadow: var(--shadow);
            max-width: 1100px;
            text-align: left;
        }
        .control-group {
            display: inline-block;
            margin: 4px 8px;
            vertical-align: top;
            min-width: 110px;
        }
        .control-group-sep {
            border-left: 1px solid var(--border);
            padding-left: 14px;
            margin-left: 4px;
        }
        .control-group label {
            font-size: 12px;
            color: var(--muted);
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .control-group > label:first-child {
            display: block;
            margin-bottom: 4px;
        }
        .divider {
            width: 1px;
            align-self: stretch;
            background: var(--border);
            margin: 4px 6px;
            min-height: 48px;
        }

        button, .controls input[type="file"]::file-selector-button {
            padding: 7px 12px;
            background: var(--green);
            color: #fff;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            margin-top: 4px;
            transition: background 0.15s, transform 0.1s;
        }
        button:hover { background: var(--green-hover); }
        button:active { transform: scale(0.98); }
        input[type="file"] {
            font-size: 12px;
            color: var(--muted);
            max-width: 160px;
        }
        input[type="range"] {
            vertical-align: middle;
            width: 120px;
            accent-color: var(--accent);
        }
        #radiusVal, #overlapVal, #cropVal {
            color: var(--accent);
            font-weight: 700;
        }

        .mode-label {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-right: 8px;
            margin-top: 6px;
            font-size: 12px;
            color: var(--text);
            background: rgba(255,255,255,0.04);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid transparent;
        }
        .mode-label:has(input:checked) {
            border-color: var(--accent);
            background: rgba(91,141,239,0.12);
        }
        .toggle-label {
            color: #e6c35c;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 8px;
            margin-right: 12px;
            font-size: 12px;
        }

        .btn-backup { background: var(--accent); }
        .btn-backup:hover { background: var(--accent-hover); }
        .btn-restore { background: var(--orange); }
        .btn-restore:hover { background: var(--orange-hover); }

        #ramHint {
            font-size: 11px;
            color: var(--orange);
            margin-top: 6px;
            max-width: 200px;
            line-height: 1.35;
            opacity: 0.9;
        }

        #canvasContainer {
            position: relative;
            display: inline-block;
            margin-top: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            background: #0a0b0e;
        }
        canvas {
            display: block;
            cursor: crosshair;
            width: 900px;
            max-width: 100vw;
            image-rendering: pixelated;
        }

        /* Popup */
        #memoPopup {
            position: absolute;
            display: none;
            background: rgba(22, 25, 34, 0.97);
            border: 1px solid var(--border-soft);
            padding: 0;
            border-radius: 12px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.04) inset;
            z-index: 20;
            width: 260px;
            text-align: left;
            pointer-events: auto;
            overflow: hidden;
            backdrop-filter: blur(8px);
        }
        .img-top {
            width: 100%;
            background: #0d0f14;
            border-bottom: 1px solid var(--border);
            position: relative;
            min-height: 48px;
            cursor: pointer;
        }
        #memoImagePreview {
            display: none;
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            vertical-align: top;
            background: #0d0f14;
        }
        .img-top-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 96px;
            color: #4a5163;
            font-size: 32px;
            font-weight: 200;
            cursor: pointer;
            user-select: none;
            transition: color 0.15s, background 0.15s;
        }
        .img-top-empty:hover {
            color: var(--accent);
            background: rgba(91,141,239,0.06);
        }
        #memoImageInput { display: none; }
        .img-actions {
            margin: 0;
            padding: 6px 10px;
            display: none;
            gap: 6px;
            background: rgba(0,0,0,0.25);
            border-bottom: 1px solid var(--border);
        }
        .img-actions button {
            padding: 4px 10px;
            font-size: 11px;
            background: #3a4050;
            margin-top: 0;
            border-radius: 6px;
        }
        .img-actions button:hover { background: var(--danger); }

        .popup-body { padding: 12px; }
        #memoText {
            width: 100%;
            height: 72px;
            background: #12151c;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 10px;
            resize: vertical;
            font-size: 12px;
            border-radius: 8px;
            font-family: inherit;
            line-height: 1.4;
            transition: border-color 0.15s;
        }
        #memoText:focus, #memoNumber:focus {
            outline: none;
            border-color: var(--accent);
        }
        #memoText::placeholder, #memoNumber::placeholder { color: #5a6275; }
        .num-row { margin-top: 8px; }
        #memoNumber {
            width: 100%;
            background: #12151c;
            color: #f0c14d;
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.05em;
        }
        .btn-group { margin-top: 10px; text-align: right; }
        .btn-close { background: var(--danger); }
        .btn-close:hover { background: var(--danger-hover); }
    </style>
</head>
<body>

    <div class="controls">
        <div class="control-group">
            <label for="imageLoader">맵사진: </label><br>
            <input type="file" id="imageLoader" accept="image/*">
        </div>
        <div class="control-group">
            <label for="baseRadius">베이스 반경: <span id="radiusVal">14</span>px</label><br>
            <input type="range" id="baseRadius" min="5" max="30" value="14" oninput="updateRadius(this.value)">
        </div>
        
        <div class="control-group">
            <label for="overlapRatio">겹침 허용도: <span id="overlapVal">0.9</span>배</label><br>
            <input type="range" id="overlapRatio" min="0.5" max="1.6" step="0.1" value="0.9" oninput="updateOverlap(this.value)">
        </div>

        <div class="control-group">
            <label for="cropBottom">하단 컷: <span id="cropVal">0</span>px</label><br>
            <input type="range" id="cropBottom" min="0" max="300" value="0" oninput="updateCrop(this.value)">
        </div>
        
        <div class="control-group" class="control-group-sep">
            <label>🖱️ 클릭 동작: </label><br>
            <label class="mode-label"><input type="radio" name="clickMode" value="memo" onchange="updateClickMode(this.value)" checked> 📝메모</label>
            <label class="mode-label"><input type="radio" name="clickMode" value="add" onchange="updateClickMode(this.value)"> ➕</label>
            <label class="mode-label"><input type="radio" name="clickMode" value="delete" onchange="updateClickMode(this.value)"> ➖</label>
        </div>

        <div class="control-group" class="control-group-sep">
            <label>백업/복구: </label><br>
            <button class="btn-backup" onclick="exportData()">백업  </button>
            <button class="btn-restore" onclick="document.getElementById('importLoader').click()">  복구</button>
            <input type="file" id="importLoader" accept=".json" style="display:none;" onchange="importData(event)">
            <div id="ramHint" style="font-size:11px;color:#FF9800;margin-top:6px;max-width:200px;line-height:1.3;"></div>
        </div>

        <div class="control-group">
            <br><button onclick="scanBases()">결과 스캔</button>
        </div>
        <div class="control-group">
            <br>
            <label class="toggle-label">
                <input type="checkbox" id="toggleBorder" onchange="updateToggle('toggleBorder', this.checked); redrawCanvas()"> 🟡 테두리
            </label>
            <label class="toggle-label">
                <input type="checkbox" id="toggleMarkers" checked onchange="updateToggle('toggleMarkers', this.checked); redrawCanvas()"> visible
            </label>
        </div>
    </div>

    <div id="canvasContainer">
        <canvas id="mapCanvas"></canvas>
        <div id="memoPopup">
            <!-- 상단: 이미지 풀폭 (클릭으로 첨부) -->
            <div class="img-top" id="imgTopClick">
                <img id="memoImagePreview" alt="미리보기">
                <div class="img-top-empty" id="imgEmptyHint">+</div>
                <input type="file" id="memoImageInput" accept="image/*" style="display:none;">
            </div>
            <div class="img-actions" id="imgActions" style="padding:4px 8px;display:none;">
                <button type="button" onclick="clearMemoImage()">이미지 제거</button>
            </div>

            <!-- 하단: 텍스트 + 숫자만 -->
            <div class="popup-body">
                <textarea id="memoText" placeholder="메모"></textarea>
                <div class="num-row">
                    <input type="text" id="memoNumber" placeholder="#" maxlength="4" inputmode="numeric" title="점 위 숫자">
                </div>
            </div>
            <!-- 숨김 호환 요소 -->
            <h4 id="memoTitle" style="display:none;"></h4>
            <span id="autoSaveStatus" style="display:none;"></span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const popup = document.getElementById('memoPopup');
        const memoText = document.getElementById('memoText');
        const memoTitle = document.getElementById('memoTitle');
        
        let mapImage = new Image();
        let bases = []; 
        let activeBaseId = null; 
        let currentImageName = "";
        
        let hoveredBase = null;
        let pendingImageData = null; // dataURL for current popup image (editing)
        let hoverOpenTimer = null;
        let hoverCloseTimer = null;
        let popupPinned = false; // true while mouse is over popup

        // 이미지는 localStorage 용량 제한 때문에 RAM에만 임시 보관 (페이지 새로고침 시 소멸 → 백업으로 복구)
        const imageStore = new Map(); // baseId -> dataURL
        let imageStoreBytes = 0;
        // 숫자도 세션 중 확실히 보이도록 RAM 캐시 (localStorage와 동기화)
        const numberStore = new Map(); // baseId -> string

        function estimateDataUrlBytes(dataUrl) {
            if (!dataUrl) return 0;
            // rough: base64 is ~4/3 of binary; dataURL header ~22 chars
            const i = dataUrl.indexOf(',');
            const b64 = i >= 0 ? dataUrl.slice(i + 1) : dataUrl;
            return Math.floor(b64.length * 0.75);
        }

        function parseStoredMemo(baseId) {
            const raw = localStorage.getItem(baseId);
            if (!raw) return { text: '', number: '' };
            try {
                const obj = JSON.parse(raw);
                if (obj && typeof obj === 'object') {
                    if ('t' in obj || 'n' in obj) {
                        return { text: obj.t || '', number: (obj.n != null && obj.n !== '') ? String(obj.n) : '' };
                    }
                    if ('text' in obj || 'image' in obj || 'number' in obj) {
                        return {
                            text: obj.text || '',
                            number: (obj.number != null && obj.number !== '') ? String(obj.number) : ''
                        };
                    }
                }
            } catch (e) {}
            return { text: raw, number: '' };
        }

        function getMemoText(baseId) {
            return parseStoredMemo(baseId).text;
        }

        function getMemoNumber(baseId) {
            if (numberStore.has(baseId)) return numberStore.get(baseId);
            return parseStoredMemo(baseId).number;
        }

        function getMemoData(baseId) {
            const s = parseStoredMemo(baseId);
            const num = numberStore.has(baseId) ? numberStore.get(baseId) : s.number;
            return {
                text: s.text,
                number: num || '',
                image: imageStore.get(baseId) || null
            };
        }

        function setMemoData(baseId, text, image, number) {
            const t = (text || '').trim();
            const n = (number != null ? String(number) : '').trim();

            // RAM 숫자 캐시 (즉시 반영)
            if (n) numberStore.set(baseId, n);
            else numberStore.delete(baseId);

            // localStorage (텍스트+숫자)
            if (!t && !n) localStorage.removeItem(baseId);
            else localStorage.setItem(baseId, JSON.stringify({ t: t, n: n }));

            // image only in RAM
            const prev = imageStore.get(baseId);
            if (prev) imageStoreBytes -= estimateDataUrlBytes(prev);
            if (image) {
                imageStore.set(baseId, image);
                imageStoreBytes += estimateDataUrlBytes(image);
            } else {
                imageStore.delete(baseId);
            }
            updateImageRamHint();
        }

        function hasMemo(baseId) {
            const s = parseStoredMemo(baseId);
            const num = numberStore.has(baseId) ? numberStore.get(baseId) : s.number;
            return !!(s.text || num || imageStore.has(baseId));
        }

        function updateImageRamHint() {
            const el = document.getElementById('ramHint');
            if (!el) return;
            const mb = (imageStoreBytes / (1024 * 1024)).toFixed(1);
            el.textContent = `🖼️ RAM 이미지: ${imageStore.size}장 · 약 ${mb}MB (새로고침 시 삭제됨)`;
        }

        function openMemoPopup(base, visualX, visualY) {
            activeBaseId = base.id;
            memoTitle.innerText = `[${base.type} - ${base.iconType}베이스] 좌표: ${base.x}, ${base.y}`;
            const data = getMemoData(base.id);
            memoText.value = data.text;
            const numVal = data.number || '';
            document.getElementById('memoNumber').value = numVal;
            if (numVal) numberStore.set(base.id, numVal);
            pendingImageData = data.image || null;
            const preview = document.getElementById('memoImagePreview');
            const actions = document.getElementById('imgActions');
            const input = document.getElementById('memoImageInput');
            input.value = '';
            const emptyHint = document.getElementById('imgEmptyHint');
            if (pendingImageData) {
                preview.src = pendingImageData;
                preview.style.display = 'block';
                actions.style.display = 'flex';
                if (emptyHint) emptyHint.style.display = 'none';
            } else {
                preview.removeAttribute('src');
                preview.style.display = 'none';
                actions.style.display = 'none';
                if (emptyHint) emptyHint.style.display = 'flex';
            }
            // 커서 바로 오른쪽 아래 고정 (컨테이너 밖이면 안쪽으로만 보정)
            const container = document.getElementById('canvasContainer');
            const cRect = container.getBoundingClientRect();
            const OFFSET_X = 12; // 커서 오른쪽
            const OFFSET_Y = 12; // 커서 아래
            popup.style.display = 'block';
            // 먼저 배치 후 실제 크기 측정
            popup.style.left = (visualX + OFFSET_X) + 'px';
            popup.style.top = (visualY + OFFSET_Y) + 'px';
            const pw = popup.offsetWidth || 280;
            const ph = popup.offsetHeight || 220;
            let left = visualX + OFFSET_X;
            let top = visualY + OFFSET_Y;
            // 오른쪽/아래로 넘칠 때만 안쪽으로 당김 (기본은 항상 커서 우측 하단)
            if (left + pw > cRect.width) left = Math.max(0, cRect.width - pw - 4);
            if (top + ph > cRect.height) top = Math.max(0, cRect.height - ph - 4);
            popup.style.left = left + 'px';
            popup.style.top = top + 'px';
            memoText.focus();
        }

        function clearMemoImage() {
            pendingImageData = null;
            document.getElementById('memoImageInput').value = '';
            const preview = document.getElementById('memoImagePreview');
            preview.removeAttribute('src');
            preview.style.display = 'none';
            document.getElementById('imgActions').style.display = 'none';
            const emptyHint = document.getElementById('imgEmptyHint');
            if (emptyHint) emptyHint.style.display = 'flex';
            autoSaveNow();
        }

        function updateRadius(val) {
            document.getElementById('radiusVal').innerText = val;
            if (currentImageName) localStorage.setItem('radius_' + currentImageName, val);
            redrawCanvas();
        }

        function updateOverlap(val) {
            document.getElementById('overlapVal').innerText = val;
            if (currentImageName) localStorage.setItem('overlap_' + currentImageName, val);
        }

        function updateCrop(val) {
            document.getElementById('cropVal').innerText = val;
            if (currentImageName) localStorage.setItem('crop_' + currentImageName, val);
            redrawCanvas();
        }

        function updateClickMode(mode) {
            if (currentImageName) localStorage.setItem('clickMode_' + currentImageName, mode);
        }

        function updateToggle(id, isChecked) {
            if (currentImageName) localStorage.setItem(id + '_' + currentImageName, isChecked);
        }

        function loadAllSettings() {
            if (!currentImageName) return;
            
            let savedRadius = localStorage.getItem('radius_' + currentImageName);
            if (savedRadius) {
                document.getElementById('baseRadius').value = savedRadius;
                document.getElementById('radiusVal').innerText = savedRadius;
            }

            let savedOverlap = localStorage.getItem('overlap_' + currentImageName);
            if (savedOverlap) {
                document.getElementById('overlapRatio').value = savedOverlap;
                document.getElementById('overlapVal').innerText = savedOverlap;
            }
            
            let savedCrop = localStorage.getItem('crop_' + currentImageName);
            if (savedCrop) {
                document.getElementById('cropBottom').value = savedCrop;
                document.getElementById('cropVal').innerText = savedCrop;
            }

            let savedBorder = localStorage.getItem('toggleBorder_' + currentImageName);
            if (savedBorder !== null) {
                document.getElementById('toggleBorder').checked = (savedBorder === 'true');
            }

            let savedMarkers = localStorage.getItem('toggleMarkers_' + currentImageName);
            if (savedMarkers !== null) {
                document.getElementById('toggleMarkers').checked = (savedMarkers === 'true');
            }

            let savedMode = localStorage.getItem('clickMode_' + currentImageName);
            if (savedMode) {
                let radio = document.querySelector(`input[name="clickMode"][value="${savedMode}"]`);
                if (radio) radio.checked = true;
            }
        }

        document.getElementById('imageLoader').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            currentImageName = file.name;
            const reader = new FileReader();
            
            reader.onload = function(event) {
                mapImage.onload = function() {
                    canvas.width = mapImage.width;
                    canvas.height = mapImage.height;
                    bases = [];
                    imageStore.clear();
                    numberStore.clear();
                    imageStoreBytes = 0;
                    updateImageRamHint();
                    closePopup();
                    
                    loadAllSettings();
                    redrawCanvas();
                }
                mapImage.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        function redrawCanvas() {
            if (!mapImage.src) return;
            ctx.drawImage(mapImage, 0, 0);
            
            const cropBottom = parseInt(document.getElementById('cropBottom').value) || 0;
            if (cropBottom > 0) {
                const lineY = canvas.height - cropBottom;
                ctx.beginPath(); ctx.moveTo(0, lineY); ctx.lineTo(canvas.width, lineY);
                ctx.strokeStyle = 'rgba(255, 0, 0, 0.8)'; ctx.lineWidth = 2; ctx.setLineDash([8, 6]); 
                ctx.stroke(); ctx.setLineDash([]); 
            }

            if (document.getElementById('toggleMarkers').checked) {
                renderBases();
            }
        }

        function renderBases() {
            const R = parseInt(document.getElementById('baseRadius').value);
            const showBorder = document.getElementById('toggleBorder').checked;

            bases.forEach(base => {
                ctx.beginPath(); 
                ctx.arc(base.x, base.y, R, 0, 2 * Math.PI);
                
                if (showBorder) {
                    ctx.strokeStyle = '#FFFF00'; 
                    ctx.lineWidth = 2; 
                    ctx.stroke();
                }
                
                if (hoveredBase && hoveredBase.id === base.id) {
                    ctx.fillStyle = 'rgba(210, 180, 140, 0.65)'; 
                    ctx.fill();
                    
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)'; 
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                let iconEmoji = "";
                if (base.iconType === "홈") iconEmoji = "";
                else if (base.iconType === "비행기") iconEmoji = "";
                else if (base.iconType === "헬기") iconEmoji = "";

                if (iconEmoji !== "") {
                    ctx.font = `${Math.max(12, R + 2)}px Arial`;
                    ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.shadowColor = "black"; ctx.shadowBlur = 4;
                    ctx.fillStyle = "white";
                    ctx.fillText(iconEmoji, base.x, base.y);
                    ctx.shadowBlur = 0; 
                }
                
                const md = getMemoData(base.id);
                if (hasMemo(base.id)) {
                    ctx.beginPath(); 
                    ctx.arc(base.x + R/1.5, base.y - R/1.5, 4, 0, 2 * Math.PI);
                    ctx.fillStyle = md.image ? '#FF9800' : (md.number ? '#FFCC80' : '#FF0000');
                    ctx.fill();
                    if (md.image) {
                        ctx.beginPath();
                        ctx.arc(base.x + R/1.5, base.y - R/1.5, 4, 0, 2 * Math.PI);
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
                // 점 위 숫자 표시 (갈색 등) — 항상 최상단
                if (md.number) {
                    const label = String(md.number);
                    const fontSize = Math.max(14, Math.floor(R * 1.15));
                    ctx.save();
                    ctx.font = `bold ${fontSize}px "Malgun Gothic", Arial, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    // 가독성: 두꺼운 검정 외곽선
                    ctx.lineJoin = 'round';
                    ctx.lineWidth = Math.max(3, fontSize * 0.28);
                    ctx.strokeStyle = 'rgba(0,0,0,0.92)';
                    ctx.strokeText(label, base.x, base.y);
                    // 갈색은 밝은 노랑, 그 외 흰색
                    ctx.fillStyle = (base.type === '갈색') ? '#FFEB3B' : '#FFFFFF';
                    ctx.fillText(label, base.x, base.y);
                    ctx.restore();
                }
            });
        }

        function identifyIcon(cx, cy, R, data, width, height) {
            let k = Math.floor(R * 0.65);
            if (k < 3) return "일반"; 

            let totalHoles = 0;
            let cols = [0, 0, 0], diag1 = [0, 0, 0], diag2 = [0, 0, 0];

            for (let dy = -k; dy <= k; dy++) {
                for (let dx = -k; dx <= k; dx++) {
                    let x = Math.round(cx + dx), y = Math.round(cy + dy);
                    if (x < 0 || x >= width || y < 0 || y >= height) continue;
                    let idx = (y * width + x) * 4;
                    let r = data[idx], g = data[idx+1], b = data[idx+2];

                    if (r < 75 && g < 75 && b < 75) {
                        totalHoles++;
                        let cIdx = dx < -k/3 ? 0 : (dx > k/3 ? 2 : 1); cols[cIdx]++;
                        let d1 = dx + dy, d1Idx = d1 < -k/2 ? 0 : (d1 > k/2 ? 2 : 1); diag1[d1Idx]++;
                        let d2 = dx - dy, d2Idx = d2 < -k/2 ? 0 : (d2 > k/2 ? 2 : 1); diag2[d2Idx]++;
                    }
                }
            }

            let area = (2 * k + 1) * (2 * k + 1);
            if (totalHoles < area * 0.08) return "일반"; 

            let pL = cols[0] / totalHoles, pC = cols[1] / totalHoles, pR = cols[2] / totalHoles;
            let pD1 = diag1[1] / totalHoles, pD2 = diag2[1] / totalHoles;

            if (pL > 0 && pR > 0 && pC < 0.50) return "홈"; 
            else if (pC > 0.50) return "헬기"; 
            else if (pD1 > 0.45 || pD2 > 0.45) return "비행기"; 
            return "일반";
        }

        function scanBases() {
            if (!mapImage.src) return alert("이미지부터 올려라");
            
            bases = [];
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            
            const R = parseInt(document.getElementById('baseRadius').value);
            const cropBottom = parseInt(document.getElementById('cropBottom').value); 
            const overlapRatio = parseFloat(document.getElementById('overlapRatio').value);

            const R_sq = R * R;
            const gridStep = 4, checkStep = 2;  

            const maxPossibleScore = (Math.PI * R_sq) / (checkStep * checkStep);
            const threshold = maxPossibleScore * 0.35; 
            const minQuadrantScore = maxPossibleScore * 0.03; 

            let candidates = [];
            const scanLimitY = canvas.height - R - cropBottom;

            for (let y = R; y < scanLimitY; y += gridStep) {
                for (let x = R; x < canvas.width - R; x += gridStep) {
                    
                    let scoreBlue = 0, scoreBrown = 0, scoreGreen = 0, scoreRed = 0;
                    let qBlue = [0,0,0,0], qBrown = [0,0,0,0], qGreen = [0,0,0,0], qRed = [0,0,0,0]; 

                    for (let dy = -R; dy <= R; dy += checkStep) {
                        for (let dx = -R; dx <= R; dx += checkStep) {
                            if (dx * dx + dy * dy <= R_sq) {
                                let cx = x + dx, cy = y + dy;
                                let idx = (cy * canvas.width + cx) * 4;
                                let r = data[idx], g = data[idx+1], b = data[idx+2];
                                let qIdx = (dx < 0 ? 0 : 1) + (dy < 0 ? 0 : 2); 

                                if (b > 100 && b > r * 1.2 && b > g * 1.2) {
                                    scoreBlue++; qBlue[qIdx]++;
                                } 
                                else if (g > 80 && g > r * 1.2 && g > b * 1.2) {
                                    scoreGreen++; qGreen[qIdx]++;
                                }
                                else if (r > 120 && r > g * 1.6 && r > b * 1.6) {
                                    scoreRed++; qRed[qIdx]++;
                                }
                                else if (r > 60 && r < 170 && g > 30 && g < 100 && b < 90 && r > g * 1.35 && r > b * 1.4) {
                                    scoreBrown++; qBrown[qIdx]++;
                                } 
                            }
                        }
                    }

                    let maxScore = Math.max(scoreBlue, scoreBrown, scoreGreen, scoreRed);
                    if (maxScore > threshold) {
                        let type, qData;
                        if (maxScore === scoreBlue) { type = "파랑"; qData = qBlue; }
                        else if (maxScore === scoreBrown) { type = "갈색"; qData = qBrown; }
                        else if (maxScore === scoreGreen) { type = "초록"; qData = qGreen; }
                        else { type = "빨강"; qData = qRed; }
                        
                        let validQuadrants = 0;
                        for(let qi = 0; qi < 4; qi++) {
                            if(qData[qi] >= minQuadrantScore) validQuadrants++;
                        }

                        if (validQuadrants >= 3) {
                            candidates.push({ x, y, score: maxScore, type });
                        }
                    }
                }
            }

            candidates.sort((a, b) => b.score - a.score);
            const MIN_DIST_SQ = (R * overlapRatio) * (R * overlapRatio); 

            for (let c of candidates) {
                let keep = true;
                for (let fb of bases) {
                    let dx = c.x - fb.x, dy = c.y - fb.y;
                    if (dx * dx + dy * dy < MIN_DIST_SQ) { keep = false; break; }
                }
                
                if (keep) {
                    let icon = identifyIcon(c.x, c.y, R, data, canvas.width, canvas.height);
                    bases.push({
                        id: `base_${c.x}_${c.y}`, x: c.x, y: c.y, type: c.type, iconType: icon
                    });
                }
            }

            document.getElementById('toggleMarkers').checked = true;
            updateToggle('toggleMarkers', true);
            // 기존 저장된 숫자 로드
            bases.forEach(b => {
                const n = parseStoredMemo(b.id).number;
                if (n) numberStore.set(b.id, n);
            });
            redrawCanvas(); 
            alert(`스캔 완료. 총 ${bases.length}개 찾음.`);
        }

        // 호버 감지 범위 R * 1.8 + 호버 시 메모/이미지 팝업
        canvas.addEventListener('mousemove', function(e) {
            if (!mapImage.src || bases.length === 0) return;
            if (popupPinned) return;

            const rect = canvas.getBoundingClientRect();
            const visualX = e.clientX - rect.left;
            const visualY = e.clientY - rect.top;
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const internalX = visualX * scaleX;
            const internalY = visualY * scaleY;
            const R = parseInt(document.getElementById('baseRadius').value);
            const detectRadius = R * 1.8;

            let prevHovered = hoveredBase;
            hoveredBase = bases.find(base => Math.hypot(base.x - internalX, base.y - internalY) < detectRadius) || null;

            if (prevHovered !== hoveredBase) {
                redrawCanvas();
                clearTimeout(hoverOpenTimer);
                clearTimeout(hoverCloseTimer);
                if (hoveredBase) {
                    const mode = document.querySelector('input[name="clickMode"]:checked').value;
                    if (mode === 'memo') {
                        const base = hoveredBase;
                        const vx = visualX, vy = visualY;
                        // 0초: 즉시 팝업
                        openMemoPopup(base, vx, vy);
                    }
                } else {
                    // 베이스 벗어나면 즉시 닫기 (팝업 위에 마우스가 있으면 유지)
                    if (!popupPinned) closePopup();
                }
            }
        });

        canvas.addEventListener('mouseleave', function(e) {
            if (hoveredBase) {
                hoveredBase = null;
                redrawCanvas();
            }
            clearTimeout(hoverOpenTimer);
            // 팝업으로 커서를 옮기는 중이면 닫지 않음
            const to = e.relatedTarget;
            if (to && (popup === to || popup.contains(to))) return;
            if (!popupPinned) closePopup();
        });

        popup.addEventListener('mouseenter', function() {
            popupPinned = true;
            clearTimeout(hoverCloseTimer);
        });
        popup.addEventListener('mouseleave', function() {
            popupPinned = false;
            // 팝업에서도 벗어나면 즉시 닫기
            if (!hoveredBase) closePopup();
        });

        // 이미지 영역 클릭 → 파일 선택
        document.getElementById('imgTopClick').addEventListener('click', function(e) {
            if (e.target && e.target.id === 'imgActions') return;
            if (e.target && e.target.tagName === 'BUTTON') return;
            document.getElementById('memoImageInput').click();
        });

        document.getElementById('memoImageInput').addEventListener('change', function(e) {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            if (file.size > 80 * 1024 * 1024) {
                alert('단일 이미지는 80MB 이하로 올려주세요. (전체는 RAM 여유에 따라 제한)');
                e.target.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = function(ev) {
                pendingImageData = ev.target.result;
                const preview = document.getElementById('memoImagePreview');
                preview.src = pendingImageData;
                preview.style.display = 'block';
                document.getElementById('imgActions').style.display = 'flex';
                const emptyHint = document.getElementById('imgEmptyHint');
                if (emptyHint) emptyHint.style.display = 'none';
                autoSaveNow();
            };
            reader.readAsDataURL(file);
        });

        memoText.addEventListener('input', scheduleAutoSave);
        const memoNumberEl = document.getElementById('memoNumber');
        memoNumberEl.addEventListener('input', scheduleAutoSave);
        memoNumberEl.addEventListener('change', scheduleAutoSave);
        memoNumberEl.addEventListener('keyup', scheduleAutoSave);

        // 클릭 감지 범위도 동일하게 넓게 설정 (R * 1.8)
        canvas.addEventListener('click', function(e) {
            if (!mapImage.src) return;
            
            const rect = canvas.getBoundingClientRect();
            const visualX = e.clientX - rect.left;
            const visualY = e.clientY - rect.top;
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const internalX = visualX * scaleX;
            const internalY = visualY * scaleY;
            const R = parseInt(document.getElementById('baseRadius').value);
            
            const detectRadius = R * 1.8;

            let clickedBaseIndex = bases.findIndex(base => Math.hypot(base.x - internalX, base.y - internalY) < detectRadius);
            let clickedBase = clickedBaseIndex !== -1 ? bases[clickedBaseIndex] : null;

            const mode = document.querySelector('input[name="clickMode"]:checked').value;

            if (mode === 'memo') {
                if (clickedBase) {
                    openMemoPopup(clickedBase, visualX, visualY);
                    popupPinned = true;
                } else { 
                    closePopup(); 
                }
            } 
            else if (mode === 'add') {
                closePopup();
                let newX = Math.round(internalX);
                let newY = Math.round(internalY);
                bases.push({
                    id: `base_${newX}_${newY}_m`, 
                    x: newX, 
                    y: newY, 
                    type: "수동", 
                    iconType: "일반"
                });
                redrawCanvas();
            } 
            else if (mode === 'delete') {
                closePopup();
                if (clickedBaseIndex !== -1) {
                    bases.splice(clickedBaseIndex, 1);
                    hoveredBase = null;
                    redrawCanvas();
                }
            }
        });

        let autoSaveTimer = null;

        function flashAutoSave(msg) {
            const el = document.getElementById('autoSaveStatus');
            if (!el) return;
            el.textContent = msg || '저장됨';
            el.style.color = '#81C784';
            clearTimeout(flashAutoSave._t);
            flashAutoSave._t = setTimeout(() => {
                el.textContent = '자동저장 ON';
                el.style.color = '#81C784';
            }, 900);
        }

        function autoSaveNow() {
            if (!activeBaseId) return;
            const numEl = document.getElementById('memoNumber');
            const num = numEl ? numEl.value : '';
            setMemoData(activeBaseId, memoText.value, pendingImageData, num);
            // 마커 꺼져 있어도 숫자는 보이도록 강제 렌더 경로
            if (!document.getElementById('toggleMarkers').checked) {
                document.getElementById('toggleMarkers').checked = true;
            }
            redrawCanvas();
            flashAutoSave(num ? ('숫자 ' + num + ' 저장') : '저장됨');
        }

        function scheduleAutoSave() {
            clearTimeout(autoSaveTimer);
            const el = document.getElementById('autoSaveStatus');
            if (el) { el.textContent = '저장 중…'; el.style.color = '#FFC107'; }
            autoSaveTimer = setTimeout(autoSaveNow, 150);
        }

        function saveMemo() {
            // 호환용: 즉시 저장 (팝업은 닫지 않음)
            clearTimeout(autoSaveTimer);
            autoSaveNow();
        }

        function closePopup() {
            // 닫기 전 미저장 입력 반영
            if (activeBaseId) {
                clearTimeout(autoSaveTimer);
                const num = document.getElementById('memoNumber').value;
                setMemoData(activeBaseId, memoText.value, pendingImageData, num);
            }
            popup.style.display = 'none';
            activeBaseId = null;
            pendingImageData = null;
            popupPinned = false;
            clearTimeout(hoverOpenTimer);
            clearTimeout(hoverCloseTimer);
            clearTimeout(autoSaveTimer);
        }

        function exportData() {
            if (!mapImage.src) return alert("백업할 지도가 없다.");
            
            const images = {};
            imageStore.forEach((v, k) => { images[k] = v; });

            let dump = {
                version: 2,
                imageSrc: mapImage.src,
                currentImageName: currentImageName,
                bases: bases,
                localStorageData: {},
                images: images // RAM 이미지 전부 포함
            };

            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                const val = localStorage.getItem(key);
                // skip accidental huge JSON blobs from older version
                if (val && val.length > 500000 && val.indexOf('data:image') !== -1) continue;
                dump.localStorageData[key] = val;
            }

            const json = JSON.stringify(dump);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "tactical_map_full_backup.json";
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 2000);
            const mb = (blob.size / (1024 * 1024)).toFixed(1);
            alert(`백업 완료 (약 ${mb}MB). 이미지 ${imageStore.size}장 포함.`);
        }

        function importData(e) {
            let file = e.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    let dump = JSON.parse(ev.target.result);
                    
                    if (dump.imageSrc) {
                        currentImageName = dump.currentImageName || "restored_map";
                        bases = dump.bases || [];
                        
                        if (dump.localStorageData) {
                            for (let key in dump.localStorageData) {
                                const val = dump.localStorageData[key];
                                if (val && val.length > 500000 && val.indexOf('data:image') !== -1) continue;
                                localStorage.setItem(key, val);
                            }
                        }

                        // RAM 이미지 복원
                        imageStore.clear();
                        imageStoreBytes = 0;
                        const imgs = dump.images || {};
                        for (let key in imgs) {
                            if (imgs[key]) {
                                imageStore.set(key, imgs[key]);
                                imageStoreBytes += estimateDataUrlBytes(imgs[key]);
                            }
                        }
                        // 구버전: localStorage JSON에 image 필드가 있던 경우 RAM으로 이관
                        for (let i = 0; i < localStorage.length; i++) {
                            const key = localStorage.key(i);
                            if (!key || !key.startsWith('base_')) continue;
                            const raw = localStorage.getItem(key);
                            try {
                                const obj = JSON.parse(raw);
                                if (obj && obj.image) {
                                    if (!imageStore.has(key)) {
                                        imageStore.set(key, obj.image);
                                        imageStoreBytes += estimateDataUrlBytes(obj.image);
                                    }
                                    localStorage.setItem(key, obj.text || '');
                                }
                            } catch (err) {}
                        }
                        updateImageRamHint();
                        
                        mapImage.onload = function() {
                            canvas.width = mapImage.width;
                            canvas.height = mapImage.height;
                            loadAllSettings();
                            redrawCanvas();
                        };
                        mapImage.src = dump.imageSrc;

                    } else {
                        for (let key in dump) {
                            localStorage.setItem(key, dump[key]);
                        }
                        redrawCanvas();
                    }
                    
                    alert(`복구 완료. 이미지 ${imageStore.size}장 RAM 적재.`);
                } catch (err) {
                    console.error(err);
                    alert("백업 파일 오류.");
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }
    </script>
