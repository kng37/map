<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>전술 지도 메모장 (호버 반응성 개선)</title>
    <style>
        body { background-color: #1e1e1e; color: white; font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; text-align: center; }
        #canvasContainer { position: relative; display: inline-block; margin-top: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); border: 2px solid #333; }
        
        canvas { 
            display: block; 
            cursor: crosshair; 
            width: 900px; 
            max-width: 100vw;
            image-rendering: pixelated; 
        }

        .controls { background: #2d2d2d; padding: 15px; border-radius: 8px; display: inline-block; vertical-align: middle; }
        .control-group { display: inline-block; margin: 0 10px; text-align: left; vertical-align: top; }
        button, input[type="file"] { padding: 8px 12px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        button:hover { background: #45a049; }
        input[type="range"] { vertical-align: middle; width: 120px; }
        .auto-tag { font-size: 11px; background: #E91E63; padding: 2px 6px; border-radius: 10px; margin-left: 5px; font-weight: normal; }
        .toggle-label { color: #FFEB3B; font-weight: bold; cursor: pointer; display: inline-block; margin-top: 10px; margin-right: 15px; }
        
        .mode-label { cursor: pointer; display: inline-block; margin-right: 5px; margin-top: 5px; font-size: 13px; }
        
        #memoPopup {
            position: absolute; display: none; background: rgba(30, 30, 30, 0.95); border: 1px solid #4CAF50; 
            padding: 10px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.8); z-index: 10;
            width: 230px; text-align: left;
        }
        #memoPopup h4 { margin: 0 0 10px 0; color: #4CAF50; font-size: 14px; }
        #memoText { width: 100%; height: 80px; background: #111; color: #fff; border: 1px solid #555; padding: 5px; box-sizing: border-box; resize: none; }
        .btn-group { margin-top: 10px; text-align: right; }
        .btn-group button { padding: 5px 10px; font-size: 12px; margin-left: 5px; }
        .btn-close { background: #f44336; }
        .btn-close:hover { background: #d32f2f; }
        
        .btn-backup { background: #2196F3; }
        .btn-backup:hover { background: #1976D2; }
        .btn-restore { background: #FF9800; }
        .btn-restore:hover { background: #F57C00; }
    </style>
</head>
<body>

    <div class="controls">
        <div class="control-group">
            <label for="imageLoader">🗺️ 지도 업로드: </label><br>
            <input type="file" id="imageLoader" accept="image/*">
        </div>
        <div class="control-group">
            <label for="baseRadius">🎯 베이스 반경: <span id="radiusVal">14</span>px</label><br>
            <input type="range" id="baseRadius" min="5" max="30" value="14" oninput="updateRadius(this.value)">
        </div>
        
        <div class="control-group">
            <label for="overlapRatio">🔗 겹침 허용도: <span id="overlapVal">0.9</span>배</label><br>
            <input type="range" id="overlapRatio" min="0.5" max="1.6" step="0.1" value="0.9" oninput="updateOverlap(this.value)">
        </div>

        <div class="control-group">
            <label for="cropBottom">✂️ 하단 컷: <span id="cropVal">0</span>px</label><br>
            <input type="range" id="cropBottom" min="0" max="300" value="0" oninput="updateCrop(this.value)">
        </div>
        
        <div class="control-group" style="border-left: 2px solid #555; padding-left: 15px;">
            <label>🖱️ 클릭 동작: </label><br>
            <label class="mode-label"><input type="radio" name="clickMode" value="memo" onchange="updateClickMode(this.value)" checked> 📝메모</label>
            <label class="mode-label"><input type="radio" name="clickMode" value="add" onchange="updateClickMode(this.value)"> ➕추가</label>
            <label class="mode-label"><input type="radio" name="clickMode" value="delete" onchange="updateClickMode(this.value)"> ➖삭제</label>
        </div>

        <div class="control-group" style="border-left: 2px solid #555; padding-left: 15px;">
            <label>💾 전체 백업/복구: </label><br>
            <button class="btn-backup" onclick="exportData()">⬇️ 백업</button>
            <button class="btn-restore" onclick="document.getElementById('importLoader').click()">⬆️ 복구</button>
            <input type="file" id="importLoader" accept=".json" style="display:none;" onchange="importData(event)">
        </div>

        <div class="control-group">
            <br><button onclick="scanBases()">🚀 정밀 스캔</button>
        </div>
        <div class="control-group">
            <br>
            <label class="toggle-label">
                <input type="checkbox" id="toggleBorder" onchange="updateToggle('toggleBorder', this.checked); redrawCanvas()"> 🟡 테두리 켜기
            </label>
            <label class="toggle-label">
                <input type="checkbox" id="toggleMarkers" checked onchange="updateToggle('toggleMarkers', this.checked); redrawCanvas()"> 👁️ 마커 숨기기
            </label>
        </div>
    </div>

    <div id="canvasContainer">
        <canvas id="mapCanvas"></canvas>
        <div id="memoPopup">
            <h4 id="memoTitle">베이스 정보</h4>
            <textarea id="memoText" placeholder="여기에 작전 메모를 입력하세요..."></textarea>
            <div class="btn-group">
                <button onclick="saveMemo()">저장</button>
                <button class="btn-close" onclick="closePopup()">닫기</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const popup = document.getElementById('memoPopup');
        const memoText = document.getElementById('memoText');
        const memoTitle = document.getElementById('memoTitle');
        
        let mapImage = new Image();
        let bases = []; 
        let activeBaseId = null; 
        let currentImageName = "";
        
        let hoveredBase = null;

        function updateRadius(val) {
            document.getElementById('radiusVal').innerText = val;
            if (currentImageName) localStorage.setItem('radius_' + currentImageName, val);
            redrawCanvas();
        }

        function updateOverlap(val) {
            document.getElementById('overlapVal').innerText = val;
            if (currentImageName) localStorage.setItem('overlap_' + currentImageName, val);
        }

        function updateCrop(val) {
            document.getElementById('cropVal').innerText = val;
            if (currentImageName) localStorage.setItem('crop_' + currentImageName, val);
            redrawCanvas();
        }

        function updateClickMode(mode) {
            if (currentImageName) localStorage.setItem('clickMode_' + currentImageName, mode);
        }

        function updateToggle(id, isChecked) {
            if (currentImageName) localStorage.setItem(id + '_' + currentImageName, isChecked);
        }

        function loadAllSettings() {
            if (!currentImageName) return;
            
            let savedRadius = localStorage.getItem('radius_' + currentImageName);
            if (savedRadius) {
                document.getElementById('baseRadius').value = savedRadius;
                document.getElementById('radiusVal').innerText = savedRadius;
            }

            let savedOverlap = localStorage.getItem('overlap_' + currentImageName);
            if (savedOverlap) {
                document.getElementById('overlapRatio').value = savedOverlap;
                document.getElementById('overlapVal').innerText = savedOverlap;
            }
            
            let savedCrop = localStorage.getItem('crop_' + currentImageName);
            if (savedCrop) {
                document.getElementById('cropBottom').value = savedCrop;
                document.getElementById('cropVal').innerText = savedCrop;
            }

            let savedBorder = localStorage.getItem('toggleBorder_' + currentImageName);
            if (savedBorder !== null) {
                document.getElementById('toggleBorder').checked = (savedBorder === 'true');
            }

            let savedMarkers = localStorage.getItem('toggleMarkers_' + currentImageName);
            if (savedMarkers !== null) {
                document.getElementById('toggleMarkers').checked = (savedMarkers === 'true');
            }

            let savedMode = localStorage.getItem('clickMode_' + currentImageName);
            if (savedMode) {
                let radio = document.querySelector(`input[name="clickMode"][value="${savedMode}"]`);
                if (radio) radio.checked = true;
            }
        }

        document.getElementById('imageLoader').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            currentImageName = file.name;
            const reader = new FileReader();
            
            reader.onload = function(event) {
                mapImage.onload = function() {
                    canvas.width = mapImage.width;
                    canvas.height = mapImage.height;
                    bases = []; 
                    closePopup();
                    
                    loadAllSettings();
                    redrawCanvas();
                }
                mapImage.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        function redrawCanvas() {
            if (!mapImage.src) return;
            ctx.drawImage(mapImage, 0, 0);
            
            const cropBottom = parseInt(document.getElementById('cropBottom').value) || 0;
            if (cropBottom > 0) {
                const lineY = canvas.height - cropBottom;
                ctx.beginPath(); ctx.moveTo(0, lineY); ctx.lineTo(canvas.width, lineY);
                ctx.strokeStyle = 'rgba(255, 0, 0, 0.8)'; ctx.lineWidth = 2; ctx.setLineDash([8, 6]); 
                ctx.stroke(); ctx.setLineDash([]); 
            }

            if (document.getElementById('toggleMarkers').checked) {
                renderBases();
            }
        }

        function renderBases() {
            const R = parseInt(document.getElementById('baseRadius').value);
            const showBorder = document.getElementById('toggleBorder').checked;

            bases.forEach(base => {
                ctx.beginPath(); 
                ctx.arc(base.x, base.y, R, 0, 2 * Math.PI);
                
                if (showBorder) {
                    ctx.strokeStyle = '#FFFF00'; 
                    ctx.lineWidth = 2; 
                    ctx.stroke();
                }
                
                if (hoveredBase && hoveredBase.id === base.id) {
                    ctx.fillStyle = 'rgba(210, 180, 140, 0.65)'; 
                    ctx.fill();
                    
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)'; 
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                let iconEmoji = "";
                if (base.iconType === "홈") iconEmoji = "";
                else if (base.iconType === "비행기") iconEmoji = "";
                else if (base.iconType === "헬기") iconEmoji = "";

                if (iconEmoji !== "") {
                    ctx.font = `${Math.max(12, R + 2)}px Arial`;
                    ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.shadowColor = "black"; ctx.shadowBlur = 4;
                    ctx.fillStyle = "white";
                    ctx.fillText(iconEmoji, base.x, base.y);
                    ctx.shadowBlur = 0; 
                }
                
                if(localStorage.getItem(base.id)) {
                    ctx.beginPath(); 
                    ctx.arc(base.x + R/1.5, base.y - R/1.5, 4, 0, 2 * Math.PI);
                    ctx.fillStyle = '#FF0000'; 
                    ctx.fill();
                }
            });
        }

        function identifyIcon(cx, cy, R, data, width, height) {
            let k = Math.floor(R * 0.65);
            if (k < 3) return "일반"; 

            let totalHoles = 0;
            let cols = [0, 0, 0], diag1 = [0, 0, 0], diag2 = [0, 0, 0];

            for (let dy = -k; dy <= k; dy++) {
                for (let dx = -k; dx <= k; dx++) {
                    let x = Math.round(cx + dx), y = Math.round(cy + dy);
                    if (x < 0 || x >= width || y < 0 || y >= height) continue;
                    let idx = (y * width + x) * 4;
                    let r = data[idx], g = data[idx+1], b = data[idx+2];

                    if (r < 75 && g < 75 && b < 75) {
                        totalHoles++;
                        let cIdx = dx < -k/3 ? 0 : (dx > k/3 ? 2 : 1); cols[cIdx]++;
                        let d1 = dx + dy, d1Idx = d1 < -k/2 ? 0 : (d1 > k/2 ? 2 : 1); diag1[d1Idx]++;
                        let d2 = dx - dy, d2Idx = d2 < -k/2 ? 0 : (d2 > k/2 ? 2 : 1); diag2[d2Idx]++;
                    }
                }
            }

            let area = (2 * k + 1) * (2 * k + 1);
            if (totalHoles < area * 0.08) return "일반"; 

            let pL = cols[0] / totalHoles, pC = cols[1] / totalHoles, pR = cols[2] / totalHoles;
            let pD1 = diag1[1] / totalHoles, pD2 = diag2[1] / totalHoles;

            if (pL > 0.18 && pR > 0.18 && pC < 0.50) return "홈"; 
            else if (pC > 0.50) return "헬기"; 
            else if (pD1 > 0.45 || pD2 > 0.45) return "비행기"; 
            return "일반";
        }

        function scanBases() {
            if (!mapImage.src) return alert("이미지부터 올려라");
            
            bases = [];
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            
            const R = parseInt(document.getElementById('baseRadius').value);
            const cropBottom = parseInt(document.getElementById('cropBottom').value); 
            const overlapRatio = parseFloat(document.getElementById('overlapRatio').value);

            const R_sq = R * R;
            const gridStep = 4, checkStep = 2;  

            const maxPossibleScore = (Math.PI * R_sq) / (checkStep * checkStep);
            const threshold = maxPossibleScore * 0.35; 
            const minQuadrantScore = maxPossibleScore * 0.03; 

            let candidates = [];
            const scanLimitY = canvas.height - R - cropBottom;

            for (let y = R; y < scanLimitY; y += gridStep) {
                for (let x = R; x < canvas.width - R; x += gridStep) {
                    
                    let scoreBlue = 0, scoreBrown = 0, scoreGreen = 0, scoreRed = 0;
                    let qBlue = [0,0,0,0], qBrown = [0,0,0,0], qGreen = [0,0,0,0], qRed = [0,0,0,0]; 

                    for (let dy = -R; dy <= R; dy += checkStep) {
                        for (let dx = -R; dx <= R; dx += checkStep) {
                            if (dx * dx + dy * dy <= R_sq) {
                                let cx = x + dx, cy = y + dy;
                                let idx = (cy * canvas.width + cx) * 4;
                                let r = data[idx], g = data[idx+1], b = data[idx+2];
                                let qIdx = (dx < 0 ? 0 : 1) + (dy < 0 ? 0 : 2); 

                                if (b > 100 && b > r * 1.2 && b > g * 1.2) {
                                    scoreBlue++; qBlue[qIdx]++;
                                } 
                                else if (g > 80 && g > r * 1.2 && g > b * 1.2) {
                                    scoreGreen++; qGreen[qIdx]++;
                                }
                                else if (r > 120 && r > g * 1.6 && r > b * 1.6) {
                                    scoreRed++; qRed[qIdx]++;
                                }
                                else if (r > 60 && r < 170 && g > 30 && g < 100 && b < 90 && r > g * 1.35 && r > b * 1.4) {
                                    scoreBrown++; qBrown[qIdx]++;
                                } 
                            }
                        }
                    }

                    let maxScore = Math.max(scoreBlue, scoreBrown, scoreGreen, scoreRed);
                    if (maxScore > threshold) {
                        let type, qData;
                        if (maxScore === scoreBlue) { type = "파랑"; qData = qBlue; }
                        else if (maxScore === scoreBrown) { type = "갈색"; qData = qBrown; }
                        else if (maxScore === scoreGreen) { type = "초록"; qData = qGreen; }
                        else { type = "빨강"; qData = qRed; }
                        
                        let validQuadrants = 0;
                        for(let qi = 0; qi < 4; qi++) {
                            if(qData[qi] >= minQuadrantScore) validQuadrants++;
                        }

                        if (validQuadrants >= 3) {
                            candidates.push({ x, y, score: maxScore, type });
                        }
                    }
                }
            }

            candidates.sort((a, b) => b.score - a.score);
            const MIN_DIST_SQ = (R * overlapRatio) * (R * overlapRatio); 

            for (let c of candidates) {
                let keep = true;
                for (let fb of bases) {
                    let dx = c.x - fb.x, dy = c.y - fb.y;
                    if (dx * dx + dy * dy < MIN_DIST_SQ) { keep = false; break; }
                }
                
                if (keep) {
                    let icon = identifyIcon(c.x, c.y, R, data, canvas.width, canvas.height);
                    bases.push({
                        id: `base_${c.x}_${c.y}`, x: c.x, y: c.y, type: c.type, iconType: icon
                    });
                }
            }

            document.getElementById('toggleMarkers').checked = true;
            updateToggle('toggleMarkers', true); 
            redrawCanvas(); 
            alert(`스캔 완료. 총 ${bases.length}개 찾음.`);
        }

        // 🚨 호버 감지 범위를 기존 반경보다 넓게 설정 (R * 1.8)[cite: 19]
        canvas.addEventListener('mousemove', function(e) {
            if (!mapImage.src || bases.length === 0) return;

            const rect = canvas.getBoundingClientRect();
            const visualX = e.clientX - rect.left;
            const visualY = e.clientY - rect.top;
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const internalX = visualX * scaleX;
            const internalY = visualY * scaleY;
            const R = parseInt(document.getElementById('baseRadius').value);
            
            // 시각적 편의를 위해 감지 반경을 1.8배 확장[cite: 19]
            const detectRadius = R * 1.8;

            let prevHovered = hoveredBase;
            hoveredBase = bases.find(base => Math.hypot(base.x - internalX, base.y - internalY) < detectRadius) || null;

            if (prevHovered !== hoveredBase) {
                redrawCanvas();
            }
        });

        canvas.addEventListener('mouseleave', function() {
            if (hoveredBase) {
                hoveredBase = null;
                redrawCanvas();
            }
        });

        // 🚨 클릭 감지 범위도 동일하게 넓게 설정 (R * 1.8)[cite: 19]
        canvas.addEventListener('click', function(e) {
            if (!mapImage.src) return;
            
            const rect = canvas.getBoundingClientRect();
            const visualX = e.clientX - rect.left;
            const visualY = e.clientY - rect.top;
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const internalX = visualX * scaleX;
            const internalY = visualY * scaleY;
            const R = parseInt(document.getElementById('baseRadius').value);
            
            const detectRadius = R * 1.8;

            let clickedBaseIndex = bases.findIndex(base => Math.hypot(base.x - internalX, base.y - internalY) < detectRadius);
            let clickedBase = clickedBaseIndex !== -1 ? bases[clickedBaseIndex] : null;

            const mode = document.querySelector('input[name="clickMode"]:checked').value;

            if (mode === 'memo') {
                if (clickedBase) {
                    activeBaseId = clickedBase.id;
                    memoTitle.innerText = `[${clickedBase.type} - ${clickedBase.iconType}베이스] 좌표: ${clickedBase.x}, ${clickedBase.y}`;
                    let savedData = localStorage.getItem(clickedBase.id);
                    memoText.value = savedData ? savedData : "";
                    
                    popup.style.left = (visualX + 15) + 'px';
                    popup.style.top = (visualY + 15) + 'px';
                    popup.style.display = 'block';
                    memoText.focus();
                } else { 
                    closePopup(); 
                }
            } 
            else if (mode === 'add') {
                closePopup();
                let newX = Math.round(internalX);
                let newY = Math.round(internalY);
                bases.push({
                    id: `base_${newX}_${newY}_m`, 
                    x: newX, 
                    y: newY, 
                    type: "수동", 
                    iconType: "일반"
                });
                redrawCanvas();
            } 
            else if (mode === 'delete') {
                closePopup();
                if (clickedBaseIndex !== -1) {
                    bases.splice(clickedBaseIndex, 1);
                    hoveredBase = null;
                    redrawCanvas();
                }
            }
        });

        function saveMemo() {
            if (activeBaseId) {
                let text = memoText.value.trim();
                if (text === "") localStorage.removeItem(activeBaseId); 
                else localStorage.setItem(activeBaseId, text); 
                
                redrawCanvas(); closePopup();
            }
        }

        function closePopup() { popup.style.display = 'none'; activeBaseId = null; }

        function exportData() {
            if (!mapImage.src) return alert("백업할 지도가 없다.");
            
            let dump = {
                imageSrc: mapImage.src,
                currentImageName: currentImageName,
                bases: bases,
                localStorageData: {}
            };

            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                dump.localStorageData[key] = localStorage.getItem(key);
            }

            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dump));
            let downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "tactical_map_full_backup.json");
            document.body.appendChild(downloadAnchorNode); 
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importData(e) {
            let file = e.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let dump = JSON.parse(e.target.result);
                    
                    if (dump.imageSrc) {
                        currentImageName = dump.currentImageName || "restored_map";
                        bases = dump.bases || [];
                        
                        for (let key in dump.localStorageData) {
                            localStorage.setItem(key, dump.localStorageData[key]);
                        }
                        
                        mapImage.onload = function() {
                            canvas.width = mapImage.width;
                            canvas.height = mapImage.height;
                            
                            loadAllSettings();
                            redrawCanvas();
                        };
                        mapImage.src = dump.imageSrc;

                    } else {
                        for (let key in dump) {
                            localStorage.setItem(key, dump[key]);
                        }
                        redrawCanvas();
                    }
                    
                    alert("풀 데이터 복구 완료.");
                } catch (err) {
                    alert("백업 파일 오류.");
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }
    </script>
</body>
</html>
